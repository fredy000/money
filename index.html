<script type="module">

  import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBdtPA1qOg_C2FEpORkzSeTsO6IKl1Klpw",
    authDomain: "money-1d58a.firebaseapp.com",
    databaseURL: "https://money-1d58a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "money-1d58a",
    storageBucket: "money-1d58a.firebasestorage.app",
    messagingSenderId: "1038447297202",

  };

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();
  const ALLOWED_EMAIL = "frdi144@gmail.com";

  let currentUser = null;
  let authReady = false;
  let authError = "";
  let stopDataListener = null;

  const TERMS = [
    { days: 0, label: "מיידי" },
    { days: 30, label: "שוטף +30" },
    { days: 60, label: "שוטף +60" },
    { days: 90, label: "שוטף +90" },
  ];

  const CATEGORIES = [
    { name: "סופר", icon: "🛒" },
    { name: "דירה", icon: "🏠" },
    { name: "דלק", icon: "🚗" },
    { name: "יציאות עם חברים", icon: "🍻" },
    { name: "אוכל", icon: "🍕" },
    { name: "מוצרי חשמל", icon: "🔌" },
    { name: "חוויה", icon: "🎟️" },
    { name: "אחר", icon: "📦" }
  ];

  let state = {
    openingBalance: 4513.73,
    incomes: [],
    expenses: [],
    creditCardBillingDay: 2
  };

  let syncStatus = "סנכרון פעיל ☁️";

  let ui = {
    tab: "dashboard",
    showIncomeForm: false,
    editingIncomeId: null,
    showExpenseForm: false,
    editingExpenseId: null,
    showBalanceEdit: false,
    showLaterExpenses: false,
    isInstallments: false,
    selectedCategory: CATEGORIES[0].name,
    tempExpense: {
      desc: "",
      amount: "",
      date: "",
      installmentsCount: "6",
      interestAmount: "",
      customMonthlyAmount: ""
    }
  };

  const uid = () => Math.random().toString(36).slice(2, 10);

  const dateToStr = (date) => {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  };

  const parseLocalDate = (value) => {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || ""));
    if (!match) return new Date(NaN);
    return new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3]),
      12
    );
  };

  const todayStr = () => dateToStr(new Date());

  const calcExpectedDate = (invoiceDateStr, termDays) => {
    const invoiceDate = parseLocalDate(invoiceDateStr);
    const daysToAdd = Number(termDays) || 0;

    if (Number.isNaN(invoiceDate.getTime())) return invoiceDateStr;
    if (daysToAdd <= 0) return invoiceDateStr;

    const endOfInvoiceMonth = new Date(
      invoiceDate.getFullYear(),
      invoiceDate.getMonth() + 1,
      0,
      12
    );

    endOfInvoiceMonth.setDate(
      endOfInvoiceMonth.getDate() + daysToAdd
    );

    return dateToStr(endOfInvoiceMonth);
  };

  const calcCreditChargeDate = (expenseDateStr, billingDay = 2) => {
    const d = parseLocalDate(expenseDateStr);
    let month = d.getMonth();
    let year = d.getFullYear();

    if (d.getDate() >= billingDay) {
      month += 1;
    }

    const lastDay = new Date(year, month + 1, 0).getDate();

    const chargeDate = new Date(
      year,
      month,
      Math.min(Number(billingDay), lastDay),
      12
    );

    return dateToStr(chargeDate);
  };

  const addMonths = (d, months) => {
    const source = parseLocalDate(d);

    const target = new Date(
      source.getFullYear(),
      source.getMonth() + Number(months),
      1,
      12
    );

    const lastDay = new Date(
      target.getFullYear(),
      target.getMonth() + 1,
      0
    ).getDate();

    target.setDate(
      Math.min(source.getDate(), lastDay)
    );

    return dateToStr(target);
  };

  const calcInstallmentStartDate = (purchaseDateStr) => {
    const purchaseDate = parseLocalDate(purchaseDateStr);

    if (Number.isNaN(purchaseDate.getTime())) {
      return purchaseDateStr;
    }

    return purchaseDate.getDate() >= 25
      ? addMonths(purchaseDateStr, 1)
      : purchaseDateStr;
  };  const normalizeInstallmentSchedules = (expenses) => {
    const normalized = (expenses || []).map((expense) => ({ ...expense }));
    const groups = new Map();

    normalized.forEach((expense) => {
      if (!expense.installmentGroupId) return;

      if (!groups.has(expense.installmentGroupId)) {
        groups.set(expense.installmentGroupId, []);
      }

      groups.get(expense.installmentGroupId).push(expense);
    });

    let changed = false;

    groups.forEach((series) => {
      if (
        series.every(
          (expense) => Number(expense.scheduleVersion) >= 2
        )
      ) {
        return;
      }

      series.sort((a, b) => {
        const aNumber = Number(
          String(a.installmentInfo || "1/1").split("/")[0]
        );

        const bNumber = Number(
          String(b.installmentInfo || "1/1").split("/")[0]
        );

        return aNumber - bNumber;
      });

      const purchaseDate =
        series[0].purchaseDate || series[0].date;

      const firstPaymentDate =
        calcInstallmentStartDate(purchaseDate);

      series.forEach((expense, index) => {
        expense.purchaseDate = purchaseDate;
        expense.date = addMonths(firstPaymentDate, index);
        expense.scheduleVersion = 2;
      });

      changed = true;
    });

    return {
      expenses: normalized,
      changed
    };
  };

  const splitInstallmentAmounts = (
    originalAmount,
    count,
    interest = 0,
    customMonthly = 0
  ) => {
    const payments = Number(count);
    const originalCents =
      Math.round(Number(originalAmount) * 100);

    if (
      !Number.isInteger(payments) ||
      payments < 2 ||
      payments > 36 ||
      originalCents <= 0
    ) {
      return [];
    }

    if (Number(customMonthly) > 0) {
      const monthlyCents =
        Math.round(Number(customMonthly) * 100);

      return Array(payments).fill(monthlyCents);
    }

    const totalCents =
      originalCents +
      Math.max(
        0,
        Math.round(Number(interest || 0) * 100)
      );

    const base =
      Math.floor(totalCents / payments);

    const remainder =
      totalCents - (base * payments);

    return Array.from(
      { length: payments },
      (_, index) =>
        base +
        (
          index >= payments - remainder
            ? 1
            : 0
        )
    );
  };

  const fmtMoney = (n) => {
    const val = Number(n || 0);

    return new Intl.NumberFormat(
      "he-IL",
      {
        style: "currency",
        currency: "ILS",
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }
    ).format(val);
  };

  const fmtDate = (d) =>
    new Intl.DateTimeFormat(
      "he-IL",
      {
        day: "numeric",
        month: "short",
        year: "2-digit"
      }
    ).format(parseLocalDate(d));

  const fmtMonth = (d) =>
    new Intl.DateTimeFormat(
      "he-IL",
      {
        month: "long",
        year: "numeric"
      }
    ).format(parseLocalDate(d));

  const monthKey = (d) =>
    d
      ? d.slice(0, 7)
      : todayStr().slice(0, 7);

  const daysUntil = (d) =>
    Math.round(
      (
        parseLocalDate(d) -
        parseLocalDate(todayStr())
      ) / 86400000
    );

  const esc = (s) =>
    String(s || "").replace(
      /[&<>"']/g,
      (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c])
    );

  function startDataListener() {
    if (stopDataListener) return;

    stopDataListener = onValue(
      dbRef,
      (snapshot) => {
        const data = snapshot.val();

        if (data) {
          state = {
            openingBalance:
              Number(data.openingBalance) || 0,

            creditCardBillingDay:
              Number(data.creditCardBillingDay) || 2,

            incomes:
              (data.incomes || []).map((inc) => ({
                ...inc,
                expectedDate: calcExpectedDate(
                  inc.date,
                  inc.termDays || 0
                )
              })),

            expenses:
              data.expenses || []
          };

          const normalizedSchedules =
            normalizeInstallmentSchedules(
              state.expenses
            );

          state.expenses =
            normalizedSchedules.expenses;

          if (normalizedSchedules.changed) {
            set(dbRef, state).catch(() => {
              syncStatus =
                "שגיאה בעדכון התשלומים ❌";
              render();
            });
          }
        } else {
          saveToCloud();
        }

        render();
      },

      () => {
        syncStatus =
          "הגישה לנתונים נחסמה ⚠️";
        render();
      }
    );
  }

  onAuthStateChanged(
    auth,
    async (user) => {
      authReady = true;
      authError = "";

      if (
        user &&
        String(user.email || "").toLowerCase() ===
          ALLOWED_EMAIL
      ) {
        currentUser = user;
        syncStatus = "סנכרון מאובטח 🔒";

        startDataListener();
        render();
        return;
      }

      if (user) {

  function calc() {
    const today = todayStr();
    const thisMonth = monthKey(today);
    const nextMonth =
      monthKey(addMonths(today, 1));

    const paid =
      (state.incomes || []).filter(
        (income) =>
          income.status === "paid"
      );

    const pending =
      (state.incomes || [])
        .filter(
          (income) =>
            income.status !== "paid"
        )
        .sort(
          (a, b) =>
            a.expectedDate.localeCompare(
              b.expectedDate
            )
        );

    const pastExpenses =
      (state.expenses || []).filter(
        (expense) =>
          monthKey(expense.date) <
          thisMonth
      );

    const currentExpenses =
      (state.expenses || []).filter(
        (expense) =>
          monthKey(expense.date) ===
          thisMonth
      );

    const futureExpenses =
      (state.expenses || []).filter(
        (expense) =>
          monthKey(expense.date) ===
          nextMonth
      );

    const laterExpenses =
      (state.expenses || []).filter(
        (expense) =>
          monthKey(expense.date) >
          nextMonth
      );

    const totalExpPast =
      pastExpenses.reduce(
        (sum, expense) =>
          sum + Number(expense.amount),
        0
      );

    const totalExpCurrent =
      currentExpenses.reduce(
        (sum, expense) =>
          sum + Number(expense.amount),
        0
      );

    const totalExpFuture =
      futureExpenses.reduce(
        (sum, expense) =>
          sum + Number(expense.amount),
        0
      );

    const totalExpLater =
      laterExpenses.reduce(
        (sum, expense) =>
          sum + Number(expense.amount),
        0
      );

    const actualCurrentBalance =
      Number(state.openingBalance || 0);

    const amountToPayThisMonth =
      totalExpCurrent;

    const balanceAfterExpenses =
      actualCurrentBalance -
      amountToPayThisMonth;

    const monthPaidIncome =
      paid
        .filter(
          (income) =>
            monthKey(
              income.paidDate ||
              income.date
            ) === thisMonth
        )
        .reduce(
          (sum, income) =>
            sum + Number(income.amount),
          0
        );

    const monthExpectedIncome =
      pending
        .filter(
          (income) =>
            monthKey(
              income.expectedDate
            ) === thisMonth
        )
        .reduce(
          (sum, income) =>
            sum + Number(income.amount),
          0
        );

    const finalExpectedBalance =
      balanceAfterExpenses +
      monthExpectedIncome;

    const safeToSpend =
      Math.max(
        0,
        balanceAfterExpenses
      );

    const overdueIncomes =
      pending.filter(
        (income) =>
          daysUntil(
            income.expectedDate
          ) < 0
      );

    const overdueAmount =
      overdueIncomes.reduce(
        (sum, income) =>
          sum + Number(income.amount),
        0
      );

    return {
      openingBalance:
        Number(
          state.openingBalance || 0
        ),

      actualCurrentBalance,
      amountToPayThisMonth,
      balanceAfterExpenses,
      finalExpectedBalance,
      pending,
      monthPaidIncome,
      monthExpectedIncome,
      totalExpPast,
      totalExpCurrent,
      totalExpFuture,
      totalExpNextMonth:
        totalExpFuture,
      totalExpLater,
      safeToSpend,
      overdueAmount,
      overdueCount:
        overdueIncomes.length,
      pastExpenses,
      currentExpenses,
      futureExpenses,
      laterExpenses
    };
  }

  async function askAI(question) {
    const cleanQuestion =
      String(question || "").trim();

    if (
      !cleanQuestion ||
      aiLoading
    ) {
      return;
    }

    const c = calc();

    aiMessages.push({
      role: "user",
      text: cleanQuestion
    });

    aiLoading = true;
    aiError = "";

    render();

    try {
      const payload = {
        ...buildAIData(c),

        question:
          cleanQuestion,

        conversation:
          aiMessages
            .slice(-8)
            .map(
              (message) => ({
                role:
                  message.role,

                text:
                  message.text
              })
            ),

        responseStyle:
          "ענה בעברית. תהיה קצר, פרקטי וישיר. עד 4 נקודות קצרות. תן מספרים מדויקים כשאפשר. אל תחפור ואל תחזור על כל הנתונים. אם נשאלת שאלה, ענה קודם עליה. אם חסר מידע, אמור בקצרה מה חסר. אל תציג ייעוץ השקעות אישי כהבטחה או ודאות."
      };

      const response =
        await fetch(
          AI_WORKER_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(payload)
          }
        );

      const result =
        await response.json();

      if (!response.ok) {
        throw new Error(
          result?.details?.error?.message ||
          result?.error ||
          "שגיאה בחיבור ל-AI"
        );
      }

      aiMessages.push({
        role: "assistant",

        text:
          String(
            result.advice ||
            "לא התקבלה תשובה מה-AI."
          )
      });
    } catch (error) {
      aiError =
        error?.message ||
        "שגיאה בתקשורת מול ה-AI.";
    } finally {
      aiLoading = false;

      render();

      requestAnimationFrame(
        () =>
          document
            .getElementById(
              "ai-question"
            )
            ?.focus()
      );
    }

  function renderExpenseRow(expense) {
    const category =
      CATEGORIES.find(

    const installmentText =

        ? ` · תשלום ${expense.installmentInfo}`

    return `

          <div class="row-title">

              category?.icon || "📦"
            }
            ${esc(expense.desc)}

              expense.category || "אחר"

          ${fmtMoney(expense.amount)}
        </div>

        <div class="actions-group">

            data-id="${expense.id}"
            title="ערוך"
          >
            ✏️
          </button>

          <button
            class="icon-btn-muted icon-btn-danger"
            data-action="delete-expense"
            data-id="${expense.id}"
            title="מחק"
          >
            🗑
          </button>
        </div>
      </div>
    `;
  }

  function renderCategoryGroups(expenses) {
    const grouped = {};

    expenses.forEach(
      (expense) => {
        const category =
          expense.category || "אחר";

        if (!grouped[category]) {
          grouped[category] = [];
        }

        grouped[category].push(
          expense
        );
      }
    );

    return Object.entries(grouped)
      .map(
        ([category, items]) => {
          const categoryInfo =
            CATEGORIES.find(
              (item) =>
                item.name === category
            );

          const total =
            items.reduce(
              (sum, expense) =>
                sum +
                Number(
                  expense.amount || 0
                ),
              0
            );

          return `
            <div
              style="
                padding:14px 0 4px;
                border-bottom:1px solid var(--border);
              "
            >
              <div
                style="
                  display:flex;
                  justify-content:space-between;
                  align-items:center;
                  color:var(--text-muted);
                  font-size:12px;
                  font-weight:700;
                  margin-bottom:2px;
                "
              >
                <span>
                  ${
                    categoryInfo?.icon ||
                    "📦"
                  }
                  ${esc(category)}
                </span>

                <span>
                  ${fmtMoney(total)}
                </span>
              </div>

              ${items
                .map(
                  (expense) =>
                    renderExpenseRow(
                      expense
                    )
                )
                .join("")}
            </div>
          `;
        }
      )
      .join("");
  }

  function renderFutureMonths(expenses) {
    const groupedByMonth = {};

    expenses.forEach(
      (expense) => {
        const key =
          monthKey(expense.date);

        if (!groupedByMonth[key]) {
          groupedByMonth[key] = [];
        }

        groupedByMonth[key].push(
          expense
        );
      }
    );

    return Object.keys(
      groupedByMonth
    )
      .sort()
      .map((key) => {
        const items =
          groupedByMonth[key];

        const total =
          items.reduce(
            (sum, expense) =>
              sum +
              Number(
                expense.amount || 0
              ),
            0
          );

        return `
          <div
            style="
              padding-top:14px;
              margin-top:4px;

              style="
                display:flex;
                justify-content:space-between;

            >

              </span>

              <span>
                ${fmtMoney(total)}
              </span>
            </div>

            ${renderCategoryGroups(items)}
          </div>
        `;
      })
      .join("");

  // ============================================================================
  // Event Listeners

  document.addEventListener(
    "click",
    (e) => {
      const btn =
        e.target.closest(
          "[data-action]"
        );

      if (!btn) return;

      const action =
        btn.dataset.action;

      const id =
        btn.dataset.id;

      if (
        action ===
        "google-login"
      ) {
        authError = "";

        googleProvider.setCustomParameters({
          login_hint:
            ALLOWED_EMAIL
        });

        signInWithPopup(
          auth,
          googleProvider
        ).catch((error) => {
          authError =
            error?.code ===
            "auth/popup-closed-by-user"
              ? "חלון ההתחברות נסגר לפני שהכניסה הושלמה."
              : "ההתחברות נכשלה. יש לוודא שכניסת Google הופעלה ב-Firebase.";

          renderLogin();
        });

      } else if (
        action === "logout"
      ) {
        signOut(auth);

      } else if (
        action === "tab"
      ) {
        ui.tab =
          btn.dataset.tab;

        render();

      } else if (
        action ===
        "toggle-balance-edit"
      ) {
        ui.showBalanceEdit =
          !ui.showBalanceEdit;

        render();

      } else if (
        action ===
        "save-balance"
      ) {
        const bVal =
          document.getElementById(
            "balance-input"
          ).value;

        state.openingBalance =
          Number(bVal) || 0;

        ui.showBalanceEdit =
          false;

        saveToCloud();

      } else if (
        action === "ask-ai"
      ) {
        const input =
          document.getElementById(
            "ai-question"
          );

        const question =
          input?.value || "";

        if (input) {
          input.value = "";
        }

        askAI(question);

      } else if (
        action ===
        "toggle-income-form"
      ) {
        ui.showIncomeForm =
          !ui.showIncomeForm;

        ui.editingIncomeId =
          null;

        render();

      } else if (
        action ===
        "edit-income"
      ) {
        ui.editingIncomeId =
          id;

        ui.showIncomeForm =
          true;

        ui.tab =
          "income";

        render();

      } else if (
        action ===
        "cancel-edit"
      ) {
        ui.editingIncomeId =
          null;

        ui.editingExpenseId =
          null;

        ui.showIncomeForm =
          false;

        ui.showExpenseForm =
          false;

        ui.isInstallments =
          false;

        render();

      } else if (
        action ===
        "save-income-direct"
      ) {
        const client =
          document.getElementById(
            "inc-client"
          ).value;

        const amount =
          Number(
            document.getElementById(
              "inc-amount"
            ).value
          );

        const date =
          document.getElementById(
            "inc-date"
          ).value;

        const termDays =
          Number(
            document.getElementById(
              "inc-term"
            ).value
          );

        if (
          !client ||
          !amount ||
          !date
        ) {
          return;
        }

        if (
          ui.editingIncomeId
        ) {
          state.incomes =
            state.incomes.map(
              (income) =>
                income.id ===
                ui.editingIncomeId
                  ? {
                      ...income,
                      client,
                      amount,
                      date,
                      termDays,
                      expectedDate:
                        calcExpectedDate(
                          date,
                          termDays
                        )
                    }
                  : income
            );
        } else {
          state.incomes.push({
            id: uid(),
            client,
            amount,
            date,
            termDays,
            status: "pending",
            expectedDate:
              calcExpectedDate(
                date,
                termDays
              )
          });
        }

        ui.showIncomeForm =
          false;

        ui.editingIncomeId =
          null;

        saveToCloud();

      } else if (
        action === "mark-paid"
      ) {
        const paidIncome =
          state.incomes.find(
            (income) =>
              income.id === id
          );

        if (
          !paidIncome ||
          paidIncome.status ===
            "paid"
        ) {
          return;
        }

        state.openingBalance =
          Number(
            state.openingBalance ||
            0
          ) +
          Number(
            paidIncome.amount ||
            0
          );

        state.incomes =
          state.incomes.map(
            (income) =>
              income.id === id
                ? {
                    ...income,
                    status: "paid",
                    paidDate:
                      todayStr(),
                    addedToCurrentBalance:
                      true
                  }
                : income
          );

        saveToCloud();

      } else if (
        action ===
        "delete-income"
      ) {
        state.incomes =
          state.incomes.filter(
            (income) =>
              income.id !== id
          );

        saveToCloud();

      } else if (
        action ===
        "toggle-expense-form"
      ) {
        ui.showExpenseForm =
          !ui.showExpenseForm;

        ui.editingExpenseId =
          null;

        render();

      } else if (
        action ===
        "toggle-later-expenses"
      ) {
        ui.showLaterExpenses =
          !ui.showLaterExpenses;

        render();

      } else if (
        action ===
        "select-category"
      ) {
        ui.selectedCategory =
          btn.dataset.cat;

        document
          .querySelectorAll(
            '[data-action="select-category"]'
          )
          .forEach((pill) => {
            pill.classList.toggle(
              "selected",
              pill.dataset.cat ===
                ui.selectedCategory
            );
          });

      } else if (
        action ===
        "edit-expense"
      ) {
        const exp =
          state.expenses.find(
            (expense) =>
              expense.id === id
          );

        if (exp) {
          ui.editingExpenseId =
            id;

          ui.selectedCategory =
            exp.category ||
            CATEGORIES[0].name;

          ui.isInstallments =
            !!exp.installmentGroupId;

          ui.showExpenseForm =
            true;

          ui.tab =
            "expenses";

          render();

          requestAnimationFrame(
            () =>
              document
                .getElementById(
                  "exp-desc"
                )
                ?.scrollIntoView({
                  behavior:
                    "smooth",
                  block:
                    "center"
                })
          );
        }

      } else if (
        action ===
        "delete-expense"
      ) {
        state.expenses =
          state.expenses.filter(
            (expense) =>
              expense.id !== id
          );

        saveToCloud();

      } else if (
        action ===
        "save-expense-direct"
      ) {
        const desc =
          document.getElementById(
            "exp-desc"
          ).value;

        const amountInput =
          Number(
            document.getElementById(
              "exp-amount"
            ).value
          );

        const date =
          document.getElementById(
            "exp-date"
          ).value;

        if (
          !desc ||
          !amountInput ||
          !date
        ) {
          return;
        }

        if (
          ui.editingExpenseId
        ) {
          const editedExpense =
            state.expenses.find(
              (expense) =>
                expense.id ===
                ui.editingExpenseId
            );

          if (
            editedExpense
              ?.installmentGroupId
          ) {
            const count =
              Number(
                document.getElementById(
                  "exp-installmentsCount"
                )?.value
              ) || 2;

            const customMonthly =
              Number(
                document.getElementById(
                  "exp-customMonthly"
                )?.value || 0
              );

            const interest =
              Number(
                document.getElementById(
                  "exp-interest"
                )?.value || 0
              );

            const installmentAmounts =
              splitInstallmentAmounts(
                amountInput,
                count,
                interest,
                customMonthly
              );

            if (
              installmentAmounts.length !==
              count
            ) {
              return;
            }

            const groupId =
              editedExpense
                .installmentGroupId;

            const fullOriginal =
              installmentAmounts.reduce(
                (sum, cents) =>
                  sum + cents,
                0
              ) / 100;

            const originalCents =
              Math.round(
                amountInput * 100
              );

            const addedCost =
              Math.max(
                0,
                Math.round(
                  fullOriginal * 100
                ) -
                originalCents
              ) / 100;

            const firstPaymentDate =
              calcInstallmentStartDate(
                date
              );

            state.expenses =
              state.expenses.filter(
                (expense) =>
                  expense
                    .installmentGroupId !==
                  groupId
              );

            for (
              let i = 0;
              i < count;
              i++
            ) {
              state.expenses.push({
                id: uid(),
                installmentGroupId:
                  groupId,
                desc,
                amount:
                  installmentAmounts[i] /
                  100,
                date:
                  addMonths(
                    firstPaymentDate,
                    i
                  ),
                purchaseDate:
                  date,
                scheduleVersion:
                  2,
                category:
                  ui.selectedCategory,
                installmentInfo:
                  `${i + 1}/${count}`,
                fullOriginalAmount:
                  fullOriginal,
                interestAmount:
                  addedCost
              });
            }
          } else {
            state.expenses =
              state.expenses.map(
                (expense) =>
                  expense.id ===
                  ui.editingExpenseId
                    ? {
                        ...expense,
                        desc,
                        amount:
                          amountInput,
                        date,
                        category:
                          ui.selectedCategory
                      }
                    : expense
              );
          }

        } else {
          const isInst =
            document.getElementById(
              "installments-check"
            )?.checked;

          if (isInst) {
            const count =
              Number(
                document.getElementById(
                  "exp-installmentsCount"
                ).value
              ) || 2;

            const customMonthly =
              Number(
                document.getElementById(
                  "exp-customMonthly"
                )?.value
              );

            const interest =
              Number(
                document.getElementById(
                  "exp-interest"
                )?.value
              );

            const installmentAmounts =
              splitInstallmentAmounts(
                amountInput,
                count,
                interest,
                customMonthly
              );

            if (
              installmentAmounts.length !==
              count
            ) {
              return;
            }

            const fullOriginal =
              installmentAmounts.reduce(
                (sum, cents) =>
                  sum + cents,
                0
              ) / 100;

            const originalCents =
              Math.round(
                amountInput * 100
              );

            const addedCost =
              Math.max(
                0,
                Math.round(
                  fullOriginal * 100
                ) -
                originalCents
              ) / 100;

            const installmentGroupId =
              uid();

            const firstPaymentDate =
              calcInstallmentStartDate(
                date
              );

            for (
              let i = 0;
              i < count;
              i++
            ) {
              const expDate =
                addMonths(
                  firstPaymentDate,
                  i
                );

              state.expenses.push({
                id: uid(),
                installmentGroupId,
                desc,
                amount:
                  installmentAmounts[i] /
                  100,
                date:
                  expDate,
                purchaseDate:
                  date,
                scheduleVersion:
                  2,
                category:
                  ui.selectedCategory,
                installmentInfo:
                  `${i + 1}/${count}`,
                fullOriginalAmount:
                  fullOriginal,
                interestAmount:
                  addedCost
              });
            }

          } else {
            const recurring =
              document.getElementById(
                "exp-recurring"
              )?.checked;

            state.expenses.push({
              id: uid(),
              desc,
              amount:
                amountInput,
              date,
              category:
                ui.selectedCategory,
              recurring:
                !!recurring
            });
          }
        }

        ui.showExpenseForm =
          false;

        ui.editingExpenseId =
          null;

        ui.isInstallments =
          false;

        saveToCloud();
      }
    }
  );  document.addEventListener("change", (e) => {
    if (e.target.id === "installments-check") {
      ui.isInstallments = e.target.checked;

      const options =
        document.getElementById(
          "installments-options"
        );

      if (options) {
        options.style.display =
          ui.isInstallments
            ? "flex"
            : "none";
      }
    }
  });

  document.addEventListener("input", (e) => {
    if (e.target.id === "exp-desc") {
      ui.tempExpense.desc =
        e.target.value;
    }

    if (e.target.id === "exp-amount") {
      ui.tempExpense.amount =
        e.target.value;
    }

    if (e.target.id === "exp-date") {
      ui.tempExpense.date =
        e.target.value;
    }

    if (
      e.target.id ===
      "exp-installmentsCount"
    ) {
      ui.tempExpense.installmentsCount =
        e.target.value;
    }

    if (
      e.target.id ===
      "exp-interest"
    ) {
      ui.tempExpense.interestAmount =
        e.target.value;
    }

    if (
      e.target.id ===
      "exp-customMonthly"
    ) {
      ui.tempExpense.customMonthlyAmount =
        e.target.value;
    }
  });

  // מאפשר לשלוח הודעה ל-AI גם עם Enter
  document.addEventListener("keydown", (e) => {
    if (
      e.target.id === "ai-question" &&
      e.key === "Enter" &&
      !e.shiftKey
    ) {
      e.preventDefault();

      const input =
        document.getElementById(
          "ai-question"
        );

      const question =
        input?.value || "";

      if (input) {
        input.value = "";
      }

      askAI(question);
    }
  });

  if (!authReady) {
    renderLogin();
  }
</script>
</body>
</html>

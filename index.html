    .form-box { background: var(--surface-card); border: 1px solid var(--border); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
    .label { display: flex; flex-direction: column; gap: 7px; font-size: 13px; font-weight: 500; color: var(--text-muted); }
    .input { background: var(--surface-input); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; color: var(--text); font-size: 15px; width: 100%; }
    .submit-btn { background: var(--accent); color: #FFF; border: none; border-radius: 12px; padding: 13px 0; font-size: 15.5px; font-weight: 700; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 15px var(--accent-glow); width: 100%; }
    .cancel-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border); border-radius: 12px; padding: 10px 0; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 6px; }
    .empty { color: var(--text-muted); font-size: 14px; padding: 16px 0; text-align: center; }

    .login-screen { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 430px; text-align: center; background: var(--surface-card); border: 1px solid var(--border); border-radius: 24px; padding: 34px 24px; box-shadow: var(--shadow); }
    .login-icon { width: 62px; height: 62px; margin: 0 auto 18px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; background: linear-gradient(135deg, var(--accent), #D84E00); box-shadow: 0 6px 20px var(--accent-glow); }
    .login-title { font-size: 23px; font-weight: 800; margin-bottom: 9px; }
    .login-text { color: var(--text-muted); font-size: 14px; line-height: 1.65; margin-bottom: 22px; }
    .google-btn { width: 100%; border: 1px solid var(--border); border-radius: 14px; background: #fff; color: #222; padding: 13px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .google-btn:hover { transform: translateY(-1px); }
    .login-error { color: var(--negative); font-size: 13px; line-height: 1.5; margin-top: 14px; }
    .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
    .logout-btn:hover { border-color: var(--accent); color: var(--text); }
  </style>

<script type="module">

  const firebaseConfig = {

    authDomain: "money-1d58a.firebaseapp.com",
    databaseURL: "https://money-1d58a-default-rtdb.europe-west1.firebasedatabase.app",

  let currentUser = null;

  const TERMS = [
    { days: 0, label: "מיידי" },

  const CATEGORIES = [

  let state = { openingBalance: 4513.73, incomes: [], expenses: [], creditCardBillingDay: 2 };
  let syncStatus = "סנכרון פעיל ☁️";

  let ui = { 
    tab: "dashboard", 
    showIncomeForm: false, 
    editingIncomeId: null,

    tempExpense: {

  };

  const uid = () => Math.random().toString(36).slice(2, 10);
  const dateToStr = (date) => {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  };

  const parseLocalDate = (value) => {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || ""));
    if (!match) return new Date(NaN);
    return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), 12);
  };

  const todayStr = () => dateToStr(new Date());
  
  const calcExpectedDate = (invoiceDateStr, termDays) => {
    const invoiceDate = parseLocalDate(invoiceDateStr);
    const daysToAdd = Number(termDays) || 0;

    if (Number.isNaN(invoiceDate.getTime())) return invoiceDateStr;
    if (daysToAdd <= 0) return invoiceDateStr;

    const endOfInvoiceMonth = new Date(
      invoiceDate.getFullYear(),
      invoiceDate.getMonth() + 1,
      0,
      12
    );
    endOfInvoiceMonth.setDate(endOfInvoiceMonth.getDate() + daysToAdd);
    return dateToStr(endOfInvoiceMonth);
  };

  const addMonths = (d, months) => {
    const source = parseLocalDate(d);
    const target = new Date(source.getFullYear(), source.getMonth() + Number(months), 1, 12);
    const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    target.setDate(Math.min(source.getDate(), lastDay));
    return dateToStr(target);
  };

  const calcInstallmentStartDate = (purchaseDateStr) => {
    const purchaseDate = parseLocalDate(purchaseDateStr);
    if (Number.isNaN(purchaseDate.getTime())) return purchaseDateStr;
    return purchaseDate.getDate() >= 25 ? addMonths(purchaseDateStr, 1) : purchaseDateStr;
  };

  const normalizeInstallmentSchedules = (expenses) => {
    const normalized = (expenses || []).map((expense) => ({ ...expense }));
    const groups = new Map();

    normalized.forEach((expense) => {
      if (!expense.installmentGroupId) return;
      if (!groups.has(expense.installmentGroupId)) groups.set(expense.installmentGroupId, []);
      groups.get(expense.installmentGroupId).push(expense);
    });

    let changed = false;

    groups.forEach((series) => {
      if (series.every((expense) => Number(expense.scheduleVersion) >= 2)) return;

      series.sort((a, b) => {
        const aNumber = Number(String(a.installmentInfo || "1/1").split("/")[0]);
        const bNumber = Number(String(b.installmentInfo || "1/1").split("/")[0]);
        return aNumber - bNumber;
      });

      const purchaseDate = series[0].purchaseDate || series[0].date;
      const firstPaymentDate = calcInstallmentStartDate(purchaseDate);

      series.forEach((expense, index) => {
        expense.purchaseDate = purchaseDate;
        expense.date = addMonths(firstPaymentDate, index);
        expense.scheduleVersion = 2;
      });

      changed = true;
    });

    return { expenses: normalized, changed };
  };

  const fmtMoney = (n) => {
    const val = Number(n || 0);
    return new Intl.NumberFormat("he-IL", { 
      style: "currency", 
      currency: "ILS", 
      minimumFractionDigits: 0, 
      maximumFractionDigits: 2 
    }).format(val);
  };

  const fmtDate = (d) => new Intl.DateTimeFormat("he-IL", { day: "numeric", month: "short", year: "2-digit" }).format(parseLocalDate(d));
  const monthKey = (d) => (d ? d.slice(0, 7) : todayStr().slice(0, 7));
  const daysUntil = (d) => Math.round((parseLocalDate(d) - parseLocalDate(todayStr())) / 86400000);
  const esc = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ============================================================================
  // ניהול מפתח GEMINI API בחינם ישירות בדפדפן (localStorage)
  // ============================================================================
  window.saveApiKey = function() {
    const input = document.getElementById("api-key-input");
    if (input && input.value.trim()) {
      localStorage.setItem("GEMINI_API_KEY", input.value.trim());
      render();
    }
  };

  window.removeApiKey = function() {
    localStorage.removeItem("GEMINI_API_KEY");
    render();
  };

  function renderAIAssistant(c) {
    const apiKey = localStorage.getItem("GEMINI_API_KEY");

    if (!apiKey) {
      return `
        <div class="ai-card">
          <div class="ai-header">
            <span class="ai-title">🤖 יועץ AI פיננסי לצלמים</span>
            <span class="ai-badge">הפעלה</span>
          </div>
          <div class="ai-text" style="text-align:center; padding: 6px 0;">
            🔑 כדי להפעיל ניתוח AI חכם ומתקדם בלייב, הדבק כאן את מפתח ה-Gemini API שלך:
          </div>
          <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
            <input type="password" id="api-key-input" class="input" placeholder="הדבק API Key כאן..." style="text-align:center;" />
            <button class="submit-btn" onclick="saveApiKey()" style="margin-top:0;">שמור מפתח והפעל AI</button>
          </div>
          <div class="ai-reason" style="text-align:center;">
            🔒 המפתח נשמר בדפדפן שלך בלבד ולא נחשף לשרתים חיצוניים או ל-GitHub.
          </div>
        </div>
      `;
    }

    setTimeout(() => fetchGeminiAdvice(c), 50);

    return `
      <div class="ai-card">
        <div class="ai-header">
          <span class="ai-title">🤖 יועץ AI פיננסי לצלמים</span>
          <button class="logout-btn" onclick="removeApiKey()">🔑 החלף מפתח</button>
        </div>
        <div id="ai-live-content" class="ai-text">
          <div style="text-align:center; padding:15px; color:var(--text-muted);">
            ⏳ מנתח את התזרים, ימי האשראי, המיסים וקרן הציוד...
          </div>
        </div>
      </div>
    `;
  }

  async function fetchGeminiAdvice(c) {
    const container = document.getElementById("ai-live-content");
    if (!container) return;

    const apiKey = localStorage.getItem("GEMINI_API_KEY");
    if (!apiKey) return;

    const prompt = `
אתה יועץ פיננסי בכיר, טקטי וממוקד לפרילנסרים בתעשיית הצילום והקולנוע.
להלן נתוני התזרים המעודכנים של המשתמש (ב-₪):
- יתרה נוכחית בעו"ש: ${c.actualCurrentBalance}
- הוצאות צפויות החודש: ${c.amountToPayThisMonth}
- הוצאות צפויות חודש הבא: ${c.totalExpNextMonth}
- הכנסות ששולמו החודש: ${c.monthPaidIncome}
- הכנסות ממתינות (שוטף+): ${c.monthExpectedIncome}
- סכום חובות באיחור גבייה: ${c.overdueAmount}

הפק ניתוח קצר, קולע ושימושי ב-4 בולטים קצרים (כלול אימוג'ים מתאימים):
1. נזילות ריאלית: חיווי על היתרה האמיתית לאחר קיזוז רזרבת מיסים (מע"מ ומקדמות מס מוערכות ב-25%-30%).
2. ציוד ובלאי: המלצה להקצאת רזרבה לשדרוג/תחזוקת ציוד צילום (מצלמות/עדשות/ציוד היקפי).
3. אופק תזרימי (Runway): הערכה לכמה זמן התזרים יספיק במקרה של ירידה בימי צילום.
4. השקעות ועודפים: המלצה מעשית לגבי עודפים פנויים (חיסכון/השקעה במדדים או מניות) או אזהרה דחופה אם יש חוסר.

ענה בקצרה, ישירות לשורה התחתונה, ללא הקדמות מנומסות.
`;

    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      const data = await res.json();

      if (data.error) {
        container.innerHTML = `⚠️ שגיאה בחיבור ל-API: ${data.error.message}. <br><button class="link-btn" onclick="removeApiKey()" style="margin-top:8px;">הזן מפתח מחדש</button>`;
        return;
      }

      const text = data.candidates[0].content.parts[0].text;
      container.innerHTML = text.replace(/\n/g, "<br>");
    } catch (err) {
      container.innerHTML = "⚠️ שגיאה בתקשורת מול ה-AI. בדוק את חיבור האינטרנט.";
    }
  }

  function startDataListener() {
    if (stopDataListener) return;

    stopDataListener = onValue(dbRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        state = {
          openingBalance: Number(data.openingBalance) || 0,
          creditCardBillingDay: Number(data.creditCardBillingDay) || 2,
          incomes: (data.incomes || []).map(inc => ({
            ...inc,
            expectedDate: calcExpectedDate(inc.date, inc.termDays || 0)
          })),
          expenses: data.expenses || []
        };

        const normalizedSchedules = normalizeInstallmentSchedules(state.expenses);
        state.expenses = normalizedSchedules.expenses;

        if (normalizedSchedules.changed) {
          set(dbRef, state).catch(() => {
            syncStatus = "שגיאה בעדכון התשלומים ❌";
            render();
          });
        }
      } else {
        saveToCloud();
      }
      render();
    }, () => {
      syncStatus = "הגישה לנתונים נחסמה ⚠️";
      render();
    });
  }

  onAuthStateChanged(auth, async (user) => {
    authReady = true;
    authError = "";

    if (user && String(user.email || "").toLowerCase() === ALLOWED_EMAIL) {
      currentUser = user;
      syncStatus = "סנכרון מאובטח 🔒";
      startDataListener();
      render();
      return;
    }

    if (user) {
      authError = "החשבון הזה אינו מורשה לצפות בנתונים.";
      await signOut(auth);
    }

    currentUser = null;
    if (stopDataListener) {
      stopDataListener();
      stopDataListener = null;
    }
    renderLogin();
  });

  async function saveToCloud() {
    if (!currentUser || String(currentUser.email || "").toLowerCase() !== ALLOWED_EMAIL) return;
    try {
      syncStatus = "שומר...";
      render();
      await set(dbRef, state);
      syncStatus = "סנכרון פעיל ☁️";
    } catch (e) {
      syncStatus = "שגיאה בשמירה ❌";
    }
    render();
  }

  function calc() {
    const today = todayStr();
    const thisMonth = monthKey(today);
    const nextMonth = monthKey(addMonths(today, 1));

    const paid = (state.incomes || []).filter((income) => income.status === "paid");
    const pending = (state.incomes || [])
      .filter((income) => income.status !== "paid")
      .sort((a, b) => a.expectedDate.localeCompare(b.expectedDate));

    const currentExpenses = (state.expenses || []).filter(
      (expense) => monthKey(expense.date) === thisMonth
    );

    const futureExpenses = (state.expenses || []).filter(
      (expense) => monthKey(expense.date) === nextMonth
    );

    const totalExpCurrent = currentExpenses.reduce((sum, expense) => sum + Number(expense.amount), 0);
    const totalExpFuture = futureExpenses.reduce((sum, expense) => sum + Number(expense.amount), 0);

    const actualCurrentBalance = Number(state.openingBalance || 0);
    const amountToPayThisMonth = totalExpCurrent;
    const balanceAfterExpenses = actualCurrentBalance - amountToPayThisMonth;

    const monthPaidIncome = paid
      .filter((income) => monthKey(income.paidDate || income.date) === thisMonth)
      .reduce((sum, income) => sum + Number(income.amount), 0);

    const monthExpectedIncome = pending
      .filter((income) => monthKey(income.expectedDate) === thisMonth)
      .reduce((sum, income) => sum + Number(income.amount), 0);

    const overdueIncomes = pending.filter((income) => daysUntil(income.expectedDate) < 0);
    const overdueAmount = overdueIncomes.reduce((sum, income) => sum + Number(income.amount), 0);

    return {
      actualCurrentBalance,
      amountToPayThisMonth,
      balanceAfterExpenses,
      monthPaidIncome,
      monthExpectedIncome,
      totalExpNextMonth: totalExpFuture,
      overdueAmount,
      pending
    };
  }

  function renderDashboard(c) {
    return `
      <div class="hero">
        <div class="hero-label">הסכום האמיתי שיש לי עכשיו בחשבון</div>
        <div class="hero-number" style="color:var(--positive)">${fmtMoney(c.actualCurrentBalance)}</div>
        <button class="link-btn" data-action="toggle-balance-edit">✏️ עדכון הסכום בחשבון</button>
        ${ui.showBalanceEdit ? `
          <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px;">
            <input class="input" id="balance-input" type="number" step="0.01" min="0" value="${state.openingBalance}" placeholder="כמה כסף יש לך עכשיו?"/>
            <button class="submit-btn" style="margin-top:0" data-action="save-balance">שמור סכום</button>
          </div>` : ""}
      </div>

      <div class="stat-row">
        ${statCard("יש לי עכשיו", fmtMoney(c.actualCurrentBalance), "var(--positive)")}
        ${statCard("אמור לרדת לי", fmtMoney(c.amountToPayThisMonth), "var(--negative)")}
        ${statCard("יישאר לי", fmtMoney(c.balanceAfterExpenses), c.balanceAfterExpenses >= 0 ? "var(--positive)" : "var(--negative)")}
      </div>

      <div class="card">
        <div class="card-title">📋 חישוב פשוט וברור</div>
        <div class="summary-box">
          <div class="summary-item" style="font-weight:700;color:var(--positive);">
            <span>1. יש לי עכשיו בחשבון:</span>
            <span>${fmtMoney(c.actualCurrentBalance)}</span>
          </div>
          <div class="summary-item" style="font-weight:700;color:var(--negative);">
            <span>2. ירדו לי הוצאות החודש:</span>
            <span>-${fmtMoney(c.amountToPayThisMonth)}</span>
          </div>
          <div class="summary-item total">
            <span>יישאר בבנק בסוף החודש:</span>
            <span>${fmtMoney(c.balanceAfterExpenses)}</span>
          </div>
        </div>
      </div>
    `;
  }

  function statCard(title, value, color) {
    return `
      <div class="stat-card">
        <div class="stat-dot-row">
          <span class="dot" style="background:${color}"></span>
          <span>${title}</span>
        </div>
        <div class="stat-value" style="color:${color}">${value}</div>
      </div>
    `;
  }

  function renderIncome() {
    return `
      <div class="card">
        <div class="card-title">💰 הכנסות ועבודות</div>
        <button class="add-btn" data-action="toggle-income-form">➕ הוסף הכנסה / חשבונית</button>
        
        ${ui.showIncomeForm ? `
          <div class="form-box">
            <div style="font-weight:700;font-size:16px;">${ui.editingIncomeId ? "עריכת הכנסה" : "הכנסה חדשה"}</div>
            <label class="label">תיאור העבודה / לקוח
              <input class="input" id="inc-desc" placeholder="למשל: יום צילום פרסומת" />
            </label>
            <label class="label">סכום (₪)
              <input class="input" id="inc-amount" type="number" step="0.01" placeholder="0.00" />
            </label>
            <label class="label">תאריך חשבונית
              <input class="input" id="inc-date" type="date" value="${todayStr()}" />
            </label>
            <label class="label">תנאי תשלום
              <select class="input" id="inc-terms">
                ${TERMS.map(t => `<option value="${t.days}">${t.label}</option>`).join("")}
              </select>
            </label>
            <button class="submit-btn" data-action="save-income">שמור הכנסה</button>
            <button class="cancel-btn" data-action="toggle-income-form">ביטול</button>
          </div>
        ` : ""}

        <div style="margin-top:16px;">
          ${(state.incomes || []).length === 0 ? '<div class="empty">אין הכנסות רשומות</div>' : 
            state.incomes.map(inc => `
              <div class="row">
                <div>
                  <div class="row-title">${esc(inc.desc)}</div>
                  <div class="row-sub">
                    <span>${fmtDate(inc.date)}</span> • 
                    <span style="color:${inc.status === 'paid' ? 'var(--positive)' : 'var(--accent)'}">
                      ${inc.status === 'paid' ? 'שולם 🎉' : 'צפוי: ' + fmtDate(inc.expectedDate)}
                    </span>
                  </div>
                </div>
                <div class="row-amount" style="color:var(--positive)">+${fmtMoney(inc.amount)}</div>
                <div class="actions-group">
                  ${inc.status !== 'paid' ? `<button class="icon-btn" data-action="mark-paid" data-id="${inc.id}">✓</button>` : ''}
                  <button class="icon-btn-muted icon-btn-danger" data-action="delete-income" data-id="${inc.id}">🗑️</button>
                </div>
              </div>
            `).join("")}
        </div>
      </div>
    `;
  }

  function renderExpenses(c) {
    return `
      <div class="card">
        <div class="card-title">💳 הוצאות ותשלומים</div>
        <button class="add-btn" data-action="toggle-expense-form">➕ הוסף הוצאה חדשה</button>

        ${ui.showExpenseForm ? `
          <div class="form-box">
            <div style="font-weight:700;font-size:16px;">הוצאה חדשה</div>
            <label class="label">תיאור ההוצאה
              <input class="input" id="exp-desc" placeholder="למשל: ציוד צילום, דלק" />
            </label>
            <label class="label">סכום (₪)
              <input class="input" id="exp-amount" type="number" step="0.01" placeholder="0.00" />
            </label>
            <label class="label">תאריך הוצאה
              <input class="input" id="exp-date" type="date" value="${todayStr()}" />
            </label>
            <button class="submit-btn" data-action="save-expense">שמור הוצאה</button>
            <button class="cancel-btn" data-action="toggle-expense-form">ביטול</button>
          </div>
        ` : ""}

        <div style="margin-top:16px;">
          ${(state.expenses || []).length === 0 ? '<div class="empty">אין הוצאות רשומות</div>' : 
            state.expenses.map(exp => `
              <div class="row">
                <div>
                  <div class="row-title">${esc(exp.desc)}</div>
                  <div class="row-sub">${fmtDate(exp.date)}</div>
                </div>
                <div class="row-amount" style="color:var(--negative)">-${fmtMoney(exp.amount)}</div>
                <div class="actions-group">
                  <button class="icon-btn-muted icon-btn-danger" data-action="delete-expense" data-id="${exp.id}">🗑️</button>
                </div>
              </div>
            `).join("")}
        </div>
      </div>
    `;
  }

  function render() {
    if (!authReady || !currentUser) {
      renderLogin();
      return;
    }

    const c = calc();
    const root = document.getElementById("app");
    root.innerHTML = `
      <div class="brand">
        <div class="brand-logo">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          </div>
          <span class="brand-text">תזרים לצלם</span>
        </div>
        <div style="display:flex;align-items:center;gap:7px;">
          <span class="sync-badge">${syncStatus}</span>
          <button class="logout-btn" data-action="logout">יציאה</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab-btn ${ui.tab === "dashboard" ? "active" : ""}" data-action="tab" data-tab="dashboard">לוח בקרה</button>
        <button class="tab-btn ${ui.tab === "income" ? "active" : ""}" data-action="tab" data-tab="income">הכנסות</button>
        <button class="tab-btn ${ui.tab === "expenses" ? "active" : ""}" data-action="tab" data-tab="expenses">הוצאות</button>
      </div>
      <div class="section">
        ${ui.tab === "dashboard" ? renderAIAssistant(c) + renderDashboard(c) : ""}
        ${ui.tab === "income" ? renderIncome() : ""}
        ${ui.tab === "expenses" ? renderExpenses(c) : ""}
      </div>
    `;
  }

  function renderLogin() {
    const root = document.getElementById("app");
    if (!root) return;

    root.innerHTML = `
      <div class="login-screen">
        <div class="login-card">
          <div class="login-icon">🔒</div>
          <div class="login-title">כניסה מאובטחת</div>
          <div class="login-text">
            המידע הפיננסי פרטי. רק חשבון Google המורשה יכול לצפות בהכנסות ובהוצאות.
          </div>
          <button class="google-btn" data-action="google-login">כניסה באמצעות Google</button>
          ${authError ? `<div class="login-error">${esc(authError)}</div>` : ""}
        </div>
      </div>
    `;
  }

  // ============================================================================
  // אירועי לחיצה וממשק משתמש (Event Listeners)
  // ============================================================================
  document.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;

    const action = btn.dataset.action;

    if (action === "google-login") {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        authError = "שגיאה בתהליך ההתחברות";
        renderLogin();
      }
    } else if (action === "logout") {
      await signOut(auth);
    } else if (action === "tab") {
      ui.tab = btn.dataset.tab;
      render();
    } else if (action === "toggle-balance-edit") {
      ui.showBalanceEdit = !ui.showBalanceEdit;
      render();
    } else if (action === "save-balance") {
      const val = parseFloat(document.getElementById("balance-input").value);
      if (!isNaN(val)) {
        state.openingBalance = val;
        ui.showBalanceEdit = false;
        saveToCloud();
      }
    } else if (action === "toggle-income-form") {
      ui.showIncomeForm = !ui.showIncomeForm;
      render();
    } else if (action === "save-income") {
      const desc = document.getElementById("inc-desc").value.trim();
      const amount = parseFloat(document.getElementById("inc-amount").value);
      const date = document.getElementById("inc-date").value;
      const termDays = parseInt(document.getElementById("inc-terms").value) || 0;

      if (desc && !isNaN(amount) && date) {
        const newIncome = {
          id: uid(),
          desc,
          amount,
          date,
          termDays,
          expectedDate: calcExpectedDate(date, termDays),
          status: "pending"
        };
        state.incomes.push(newIncome);
        ui.showIncomeForm = false;
        saveToCloud();
      }
    } else if (action === "mark-paid") {
      const id = btn.dataset.id;
      const inc = state.incomes.find(i => i.id === id);
      if (inc) {
        inc.status = "paid";
        inc.paidDate = todayStr();
        saveToCloud();
      }
    } else if (action === "delete-income") {
      const id = btn.dataset.id;
      state.incomes = state.incomes.filter(i => i.id !== id);
      saveToCloud();
    } else if (action === "toggle-expense-form") {
      ui.showExpenseForm = !ui.showExpenseForm;
      render();
    } else if (action === "save-expense") {
      const desc = document.getElementById("exp-desc").value.trim();
      const amount = parseFloat(document.getElementById("exp-amount").value);
      const date = document.getElementById("exp-date").value;

      if (desc && !isNaN(amount) && date) {
        const newExpense = { id: uid(), desc, amount, date };
        state.expenses.push(newExpense);
        ui.showExpenseForm = false;
        saveToCloud();
      }
    } else if (action === "delete-expense") {
      const id = btn.dataset.id;
      state.expenses = state.expenses.filter(e => e.id !== id);
      saveToCloud();
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>תזרים לצלם</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap');
:root {
  --bg: #16140F;
  --surface: #211E17;
  --surface-2: #2A261C;
  --text: #F1EBDD;
  --text-muted: #A79C87;
  --accent: #E2793D;
  --positive: #7FA37A;
  --negative: #C2695C;
  --border: #3A3428;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); font-family: 'Rubik', system-ui, sans-serif; min-height: 100vh; }
#app { width: 100%; max-width: 640px; margin: 0 auto; padding: 28px 18px 60px; }
input, select, button { font-family: inherit; outline: none; }
input:focus, select:focus, button:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
::placeholder { color: #6E6553; }
.brand { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
.brand svg { color: var(--accent); }
.brand-text { font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 21px; color: var(--text); }
.tabs { display: flex; gap: 6px; background: var(--surface); padding: 4px; border-radius: 10px; margin-bottom: 22px; }
.tab-btn { flex: 1; padding: 9px 0; border: none; background: transparent; color: var(--text-muted); border-radius: 7px; font-size: 14px; cursor: pointer; }
.tab-btn.active { background: var(--surface-2); color: var(--text); }
.section { display: flex; flex-direction: column; gap: 16px; }
.hero { background: linear-gradient(160deg, var(--surface) 0%, var(--surface) 70%, #2E2311 100%); border: 1px solid var(--border); border-radius: 18px; padding: 26px 22px; text-align: center; }
.hero-label { color: var(--text-muted); font-size: 13.5px; margin-bottom: 6px; }
.hero-number { font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 44px; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.link-btn { margin-top: 10px; background: none; border: none; color: var(--text-muted); font-size: 12.5px; text-decoration: underline; cursor: pointer; }
.stat-row { display: flex; gap: 10px; }
.stat-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.stat-dot-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-muted); margin-bottom: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.stat-value { font-size: 17px; color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.card-title { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.p { color: var(--text-muted); font-size: 14px; line-height: 1.7; margin: 0 0 8px; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.row-title { color: var(--text); font-size: 14.5px; }
.row-sub { color: var(--text-muted); font-size: 12.5px; margin-top: 2px; }
.row-amount { color: var(--text); font-variant-numeric: tabular-nums; font-size: 14.5px; font-weight: 600; white-space: nowrap; }
.icon-btn { background: var(--positive); border: none; color: #12160F; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; }
.icon-btn-muted { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.add-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: var(--accent); color: #221204; border: none; border-radius: 10px; padding: 11px 0; font-size: 14.5px; font-weight: 600; cursor: pointer; }
.form-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-muted); }
.input { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; color: var(--text); font-size: 14.5px; }
.form-hint { font-size: 12.5px; color: var(--text-muted); }
.submit-btn { background: var(--accent); color: #221204; border: none; border-radius: 8px; padding: 10px 0; font-size: 14.5px; font-weight: 600; cursor: pointer; }
.empty { color: var(--text-muted); font-size: 14px; padding: 8px 0; }
.checkbox-label { flex-direction: row-reverse; align-items: center; gap: 8px; display: flex; }
.save-error { margin-top: 14px; font-size: 12.5px; color: var(--negative); text-align: center; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const TERMS = [
  { days: 0, label: "מיידי" },
  { days: 30, label: "שוטף +30" },
  { days: 60, label: "שוטף +60" },
  { days: 90, label: "שוטף +90" },
];
const CATEGORIES = ["ציוד ואחזקה","תוכנות ומנויים","ביטוח","שיווק ופרסום","נסיעות והובלה","אולפן ושכירות","מיסים וביטוח לאומי","אחר"];

const LOCAL_KEY = "tazrim-tzalam-data";

let state = { openingBalance: 0, incomes: [], expenses: [] };
try {
  const raw = localStorage.getItem(LOCAL_KEY);
  if (raw) state = JSON.parse(raw);
} catch (e) { /* keep defaults */ }

let ui = { tab: "dashboard", showIncomeForm: false, showExpenseForm: false, showBalanceEdit: false, saveError: false };

const uid = () => Math.random().toString(36).slice(2, 10);
const todayStr = () => new Date().toISOString().slice(0, 10);
const addDays = (d, days) => { const x = new Date(d); x.setDate(x.getDate() + Number(days)); return x.toISOString().slice(0, 10); };
const fmtMoney = (n) => new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS", maximumFractionDigits: 0 }).format(n || 0);
const fmtDate = (d) => new Intl.DateTimeFormat("he-IL", { day: "numeric", month: "short" }).format(new Date(d));
const monthKey = (d) => d.slice(0, 7);
const daysUntil = (d) => Math.round((new Date(d) - new Date(todayStr())) / 86400000);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function persist() {
  ui.saveError = false;
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); }
  catch (e) { ui.saveError = true; }
  render();
}

function calc() {
  const today = todayStr();
  const thisMonth = monthKey(today);
  const paid = state.incomes.filter((i) => i.status === "paid");
  const pending = state.incomes.filter((i) => i.status !== "paid").sort((a, b) => (a.expectedDate > b.expectedDate ? 1 : -1));
  const totalPaid = paid.reduce((s, i) => s + Number(i.amount), 0);
  const totalExpSoFar = state.expenses.filter((e) => e.date <= today).reduce((s, e) => s + Number(e.amount), 0);
  const availableNow = Number(state.openingBalance || 0) + totalPaid - totalExpSoFar;
  const monthPaidIncome = paid.filter((i) => monthKey(i.paidDate || i.date) === thisMonth).reduce((s, i) => s + Number(i.amount), 0);
  const monthExpectedIncome = pending.filter((i) => monthKey(i.expectedDate) === thisMonth).reduce((s, i) => s + Number(i.amount), 0);
  const monthExpenses = state.expenses.filter((e) => monthKey(e.date) === thisMonth).reduce((s, e) => s + Number(e.amount), 0);
  const mm = {};
  paid.forEach((i) => { const mk = monthKey(i.paidDate || i.date); if (mk === thisMonth) return; mm[mk] = mm[mk] || { income: 0, expense: 0 }; mm[mk].income += Number(i.amount); });
  state.expenses.forEach((e) => { const mk = monthKey(e.date); if (mk === thisMonth) return; mm[mk] = mm[mk] || { income: 0, expense: 0 }; mm[mk].expense += Number(e.amount); });
  const months = Object.keys(mm);
  let avgIncome = 0, avgExpense = 0;
  if (months.length > 0) {
    avgIncome = months.reduce((s, m) => s + mm[m].income, 0) / months.length;
    avgExpense = months.reduce((s, m) => s + mm[m].expense, 0) / months.length;
  }
  return { availableNow, pending, monthPaidIncome, monthExpectedIncome, monthExpenses, avgIncome, avgExpense, avgSurplus: avgIncome - avgExpense, monthsCounted: months.length };
}

function render() {
  const c = calc();
  const root = document.getElementById("app");
  root.innerHTML = `
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      <span class="brand-text">תזרים לצלם</span>
    </div>
    <div class="tabs">
      <button class="tab-btn ${ui.tab === "dashboard" ? "active" : ""}" data-action="tab" data-tab="dashboard">לוח בקרה</button>
      <button class="tab-btn ${ui.tab === "income" ? "active" : ""}" data-action="tab" data-tab="income">הכנסות</button>
      <button class="tab-btn ${ui.tab === "expenses" ? "active" : ""}" data-action="tab" data-tab="expenses">הוצאות</button>
    </div>
    <div class="section">
      ${ui.tab === "dashboard" ? renderDashboard(c) : ""}
      ${ui.tab === "income" ? renderIncome() : ""}
      ${ui.tab === "expenses" ? renderExpenses() : ""}
      ${ui.saveError ? '<div class="save-error">השמירה במכשיר הזה נכשלה. נסה לפנות מקום באחסון הדפדפן או להשתמש בדפדפן אחר.</div>' : ""}
    </div>
  `;
}

function renderDashboard(c) {
  const hasData = state.incomes.length > 0 || state.expenses.length > 0;
  return `
    <div class="hero">
      <div class="hero-label">יתרה זמינה כרגע</div>
      <div class="hero-number">${fmtMoney(c.availableNow)}</div>
      <button class="link-btn" data-action="toggle-balance-edit">עדכון יתרת פתיחה</button>
      ${ui.showBalanceEdit ? `<div style="margin-top:10px;display:flex;gap:8px;"><input class="input" style="flex:1" id="balance-input" type="number" inputmode="decimal" value="${state.openingBalance}" placeholder="יתרת בנק נוכחית"/><button class="submit-btn" style="padding:0 16px" data-action="save-balance">עדכון</button></div>` : ""}
    </div>
    <div class="stat-row">
      ${statCard("התקבל החודש", fmtMoney(c.monthPaidIncome), "var(--positive)")}
      ${statCard("הוצאות החודש", fmtMoney(c.monthExpenses), "var(--negative)")}
      ${statCard("עוד צפוי החודש", fmtMoney(c.monthExpectedIncome), "var(--accent)")}
    </div>
    <div class="card">
      <div class="card-title">בדרך אליך</div>
      ${c.pending.length === 0 ? '<div class="empty">אין תשלומים ממתינים כרגע. כל מה שהזנת כבר שולם.</div>' :
        c.pending.map((inc) => {
          const d = daysUntil(inc.expectedDate);
          return `<div class="row">
            <div style="flex:1">
              <div class="row-title">${esc(inc.client)}</div>
              <div class="row-sub">צפוי ב${fmtDate(inc.expectedDate)} · ${d >= 0 ? "בעוד " + d + " ימים" : "באיחור של " + (-d) + " ימים"}</div>
            </div>
            <div class="row-amount">${fmtMoney(inc.amount)}</div>
            <button class="icon-btn" data-action="mark-paid" data-id="${inc.id}" title="סמן כשולם">✓</button>
          </div>`;
        }).join("")}
    </div>
    <div class="card">
      <div class="card-title">יכולת חיסכון</div>
      ${c.monthsCounted === 0
        ? '<div class="empty">אחרי שיצטברו לך חודש-חודשיים של הכנסות שסומנו כשולמו והוצאות, כאן תופיע הערכה כמה אפשר לשים בצד כל חודש.</div>'
        : `<p class="p">בממוצע על ${c.monthsCounted} ${c.monthsCounted === 1 ? "חודש" : "חודשים"} מלאים שנרשמו, נכנסו לך כ${fmtMoney(c.avgIncome)} ויצאו כ${fmtMoney(c.avgExpense)}.</p>
           ${c.avgSurplus > 0
             ? `<p class="p">נשאר עודף ממוצע של <strong style="color:var(--positive)">${fmtMoney(c.avgSurplus)}</strong> לחודש. בגלל השוטף +30/+60, כדאי קודם לבנות כרית של חודש-חודשיים הוצאות בצד, ורק אחר כך להתייחס לעודף הזה כחיסכון קבוע.</p>`
             : `<p class="p">בממוצע ההוצאות עולות על ההכנסות שכבר התקבלו ב<strong style="color:var(--negative)"> ${fmtMoney(-c.avgSurplus)}</strong> לחודש. לפני חיסכון, שווה לבדוק אילו הוצאות קבועות אפשר לצמצם, או להדק מעקב אחרי לקוחות עם תשלום שוטף ארוך.</p>`}`}
    </div>
    ${!hasData ? '<p class="p" style="text-align:center">התחל בהוספת עבודה בלשונית הכנסות, או הוצאה בלשונית הוצאות.</p>' : ""}
  `;
}

function statCard(label, value, dot) {
  return `<div class="stat-card"><div class="stat-dot-row"><span class="dot" style="background:${dot}"></span>${label}</div><div class="stat-value">${value}</div></div>`;
}

function renderIncome() {
  const sorted = [...state.incomes].sort((a, b) => (a.date < b.date ? 1 : -1));
  return `
    <button class="add-btn" data-action="toggle-income-form">+ הוספת עבודה</button>
    ${ui.showIncomeForm ? `
    <form class="form-box" id="income-form">
      <label class="label">לקוח / עבודה<input class="input" name="client" placeholder="למשל: חתונה — משפחת כהן" required/></label>
      <label class="label">סכום<input class="input" name="amount" type="number" placeholder="0" required/></label>
      <label class="label">תאריך העבודה / החשבונית<input class="input" name="date" type="date" value="${todayStr()}"/></label>
      <label class="label">תנאי תשלום
        <select class="input" name="termDays" id="term-select">
          ${TERMS.map((t) => `<option value="${t.days}">${t.label}</option>`).join("")}
        </select>
      </label>
      <button type="submit" class="submit-btn">שמירה</button>
    </form>` : ""}
    <div>
      ${sorted.length === 0 ? '<div class="empty">עדיין לא נוספו עבודות.</div>' : sorted.map((inc) => `
        <div class="row">
          <div style="flex:1">
            <div class="row-title">${esc(inc.client)}</div>
            <div class="row-sub">${fmtDate(inc.date)} · ${inc.status === "paid" ? `<span style="color:var(--positive)">שולם ${fmtDate(inc.paidDate)}</span>` : `<span style="color:var(--accent)">צפוי ${fmtDate(inc.expectedDate)}</span>`}</div>
          </div>
          <div class="row-amount">${fmtMoney(inc.amount)}</div>
          ${inc.status !== "paid" ? `<button class="icon-btn" data-action="mark-paid" data-id="${inc.id}" title="סמן כשולם">✓</button>` : ""}
          <button class="icon-btn-muted" data-action="delete-income" data-id="${inc.id}" title="מחיקה">🗑</button>
        </div>`).join("")}
    </div>
  `;
}

function renderExpenses() {
  const sorted = [...state.expenses].sort((a, b) => (a.date < b.date ? 1 : -1));
  return `
    <button class="add-btn" data-action="toggle-expense-form">+ הוספת הוצאה</button>
    ${ui.showExpenseForm ? `
    <form class="form-box" id="expense-form">
      <label class="label">תיאור<input class="input" name="desc" placeholder="למשל: ליסינג עדשה" required/></label>
      <label class="label">סכום<input class="input" name="amount" type="number" placeholder="0" required/></label>
      <label class="label">תאריך<input class="input" name="date" type="date" value="${todayStr()}"/></label>
      <label class="label">קטגוריה
        <select class="input" name="category">${CATEGORIES.map((c) => `<option value="${c}">${c}</option>`).join("")}</select>
      </label>
      <label class="label checkbox-label"><input type="checkbox" name="recurring" style="width:16px;height:16px"/> הוצאה שחוזרת כל חודש</label>
      <button type="submit" class="submit-btn">שמירה</button>
    </form>` : ""}
    <div>
      ${sorted.length === 0 ? '<div class="empty">עדיין לא נוספו הוצאות.</div>' : sorted.map((exp) => `
        <div class="row">
          <div style="flex:1">
            <div class="row-title">${esc(exp.desc)}</div>
            <div class="row-sub">${fmtDate(exp.date)} · ${exp.category}${exp.recurring ? " · חוזרת" : ""}</div>
          </div>
          <div class="row-amount" style="color:var(--negative)">-${fmtMoney(exp.amount)}</div>
          <button class="icon-btn-muted" data-action="delete-expense" data-id="${exp.id}" title="מחיקה">🗑</button>
        </div>`).join("")}
    </div>
  `;
}

// event delegation
document.getElementById("app").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === "tab") { ui.tab = btn.dataset.tab; render(); }
  else if (action === "toggle-balance-edit") { ui.showBalanceEdit = !ui.showBalanceEdit; render(); }
  else if (action === "save-balance") {
    const input = document.getElementById("balance-input");
    state.openingBalance = Number(input.value) || 0;
    ui.showBalanceEdit = false;
    persist();
  }
  else if (action === "toggle-income-form") { ui.showIncomeForm = !ui.showIncomeForm; render(); }
  else if (action === "toggle-expense-form") { ui.showExpenseForm = !ui.showExpenseForm; render(); }
  else if (action === "mark-paid") {
    const inc = state.incomes.find((i) => i.id === btn.dataset.id);
    if (inc) { inc.status = "paid"; inc.paidDate = todayStr(); persist(); }
  } else if (action === "delete-income") {
    state.incomes = state.incomes.filter((i) => i.id !== btn.dataset.id); persist();
  } else if (action === "delete-expense") {
    state.expenses = state.expenses.filter((e) => e.id !== btn.dataset.id); persist();
  }
});

document.getElementById("app").addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "income-form") {
    const fd = new FormData(e.target);
    const date = fd.get("date") || todayStr();
    const termDays = Number(fd.get("termDays"));
    const expectedDate = addDays(date, termDays);
    state.incomes.push({
      id: uid(), client: fd.get("client"), amount: Number(fd.get("amount")), date, termDays, expectedDate,
      status: termDays === 0 ? "paid" : "pending", paidDate: termDays === 0 ? date : null,
    });
    ui.showIncomeForm = false; persist();
  } else if (e.target.id === "expense-form") {
    const fd = new FormData(e.target);
    state.expenses.push({
      id: uid(), desc: fd.get("desc"), amount: Number(fd.get("amount")), date: fd.get("date") || todayStr(),
      category: fd.get("category"), recurring: fd.get("recurring") === "on",
    });
    ui.showExpenseForm = false; persist();
  }
});

render();
</script>
</body>
</html>

function incomePage(){
  const list=state.incomes.filter(i=>inRange(i.status==='paid'?i.paidDate:i.date,ui.incomeRange)&&(ui.incomeStatus==='all'||i.status===ui.incomeStatus)).sort((a,b)=>(a.status==='paid'?a.paidDate:a.expectedDate).localeCompare(b.status==='paid'?b.paidDate:b.expectedDate));
  const paid=list.filter(i=>i.status==='paid').reduce((s,i)=>s+i.amountCents,0),pending=list.filter(i=>i.status==='pending').reduce((s,i)=>s+i.amountCents,0);
  return `<div class="card"><div class="card-head"><h2>עבודות וחשבוניות</h2>${button('+ הכנסה','new-income','','primary')}</div><p class="hint">תנאי ״מיידי״ אינם מסמנים שהכסף התקבל. תשלום מאושר רק לאחר שאתה מסמן אותו.</p><div class="filter-row">${rangeControl(ui.incomeRange,'income-range')}<select class="filter" data-change="income-status" aria-label="סטטוס הכנסה">${options([{value:'all',label:'הכול'},{value:'pending',label:'ממתין לתשלום'},{value:'paid',label:'שולם'}],ui.incomeStatus)}</select><span class="hint">התקבל: <b class="green">${money(paid)}</b> · ממתין: <b class="orange">${money(pending)}</b></span></div><div class="list">${list.length?list.map(i=>`<div class="row"><div class="row-main"><div class="row-title">${esc(i.client)}</div><div class="row-sub">חשבונית: ${dateLabel(i.date)} · ${esc(TERMS.find(t=>t.value===i.termDays)?.label)}<br>${i.status==='paid'?`<span class="green">שולם: ${dateLabel(i.paidDate)}</span>`:`<span class="${i.expectedDate<E.today()?'red':'orange'}">${i.expectedDate<E.today()?'באיחור — מועד':'צפוי'}: ${dateLabel(i.expectedDate)}</span>`}</div></div><div class="amount ${i.status==='paid'?'green':'orange'}">${money(i.amountCents)}</div><div class="actions">${i.status==='pending'?button('✓ התקבל','pay-income',`data-id="${i.id}"`):button('ביטול סימון','undo-income',`data-id="${i.id}"`)}${button('עריכה','edit-income',`data-id="${i.id}"`)}${button('מחיקה','delete-income',`data-id="${i.id}"`,'danger')}</div></div>`).join(''):'<div class="empty">אין הכנסות בסינון שנבחר.</div>'}</div></div>`;
}
function expensePage(){
  const end=E.addDays(E.today(),366),all=E.occurrences(state,end),list=all.filter(o=>ui.expenseScope==='all'||o.scope===ui.expenseScope),history=state.receipts.filter(r=>ui.expenseScope==='all'||r.scope===ui.expenseScope).sort((a,b)=>b.paidDate.localeCompare(a.paidDate));
  return `<div class="card"><div class="card-head"><h2>חיובים והוצאות <small class="muted">(${state.expenses.length} רשומות)</small></h2>${button('+ הוצאה','new-expense','','primary')}</div><p class="hint">רכישה ותאריך ירידה מהבנק הם שני תאריכים נפרדים. באשראי הזן את החיוב בפועל. כדי למנוע כפילות, בחר אם להזין חיוב אשראי כולל או את הרכישות המרכיבות אותו.</p><div class="filter-row"><select class="filter" data-change="expense-status" aria-label="סינון הוצאות">${options([{value:'pending',label:'ממתין לחיוב — שנה קדימה'},{value:'paid',label:'חיובים שאושרו'},{value:'series',label:'כל ההוצאות והסדרות'}],ui.expenseStatus)}</select><select class="filter" data-change="expense-scope" aria-label="תחום הוצאה">${options([{value:'all',label:'עסקי ואישי'},{value:'עסקי',label:'עסקי'},{value:'אישי',label:'אישי'}],ui.expenseScope)}</select></div><div class="list">${ui.expenseStatus==='pending'?(list.length?list.map(o=>`<div class="row"><div class="row-main"><div class="row-title">${esc(o.title)}</div><div class="row-sub">${dateLabel(o.date)} · ${esc(o.label)} · ${esc(o.category)} · ${esc(o.scope)}<br>${esc(o.method)} ${o.date<E.today()?'<span class="red">· מועד החיוב עבר, טרם אושר</span>':''}</div></div><div class="amount red">−${money(o.amountCents)}</div><div class="actions">${button('✓ ירד מהבנק','pay-expense',`data-id="${o.key}"`)}${button('עריכת חיוב','edit-occurrence',`data-id="${o.key}"`)}${button('ביטול חיוב','cancel-occurrence',`data-id="${o.key}"`,'danger')}</div></div>`).join(''):'<div class="empty">אין חיובים ממתינים לשנה הקרובה.</div>'):ui.expenseStatus==='paid'?(history.length?history.map(r=>`<div class="row"><div class="row-main"><div class="row-title">${esc(r.title)}</div><div class="row-sub">ירד: ${dateLabel(r.paidDate)} · ${esc(r.category||'כללי')} · ${esc(r.scope||'עסקי')}</div></div><div class="amount red">−${money(r.amountCents)}</div><div class="actions">${button('ביטול סימון','undo-expense',`data-id="${r.key}"`)}</div></div>`).join(''):'<div class="empty">אין חיובים שאושרו.</div>'):renderSeries()}</div></div>`;
}
function renderSeries(){const list=state.expenses.filter(e=>ui.expenseScope==='all'||e.scope===ui.expenseScope);return list.length?list.map(e=>`<div class="row"><div class="row-main"><div class="row-title">${esc(e.desc)}</div><div class="row-sub">${esc(e.legacyInstallmentInfo?'תשלום '+e.legacyInstallmentInfo:KIND.find(k=>k.value===e.kind)?.label)} · חיוב ראשון: ${dateLabel(e.chargeDate)} · ${esc(e.scope)}${e.kind==='installments'?` · ${e.count} תשלומים`:''}${e.endDate?` · מסתיים: ${dateLabel(e.endDate)}`:''}<br>${e.kind==='installments'?'סכום הרכישה הכולל':e.kind==='monthly'?'סכום בכל חיוב':'סכום החיוב'}: ${money(e.amountCents)}</div></div><div class="actions">${button('עריכת סדרה','edit-expense',`data-id="${e.id}"`)}${e.kind==='monthly'?button('סיום סדרה','stop-series',`data-id="${e.id}"`):''}${button('מחיקת סדרה','delete-expense',`data-id="${e.id}"`,'danger')}</div></div>`).join(''):'<div class="empty">עדיין אין הוצאות. הוסף חד־פעמיות, תשלומים או הוצאות קבועות.</div>';}
function forecastPage(f){return `<div class="card">${period()}<h2>תחזית עד ${dateLabel(f.end)}</h2>${chart(f)}<div class="summary-row total"><span>יתרה בסוף התקופה לפני הפרדה למס ולכרית</span><b class="${f.balance<0?'red':'green'}">${money(f.balance)}</b></div><p class="hint">רזרבה למס בסוף התחזית: ${money(f.reserveEnd)}. תחזית הגבייה מניחה שהלקוחות ישלמו במועד. חיובים שלא אושרו ומועדיהם עברו מופיעים כהוצאה היום.</p></div><div class="card"><h2>מה נכנס ומה יוצא</h2><div class="table-wrap"><table><thead><tr><th>תאריך</th><th>תיאור</th><th>נכנס</th><th>יוצא</th><th>יתרה בבנק</th><th>אחרי רזרבה למס</th></tr></thead><tbody><tr><td>היום</td><td>יתרה לפי העדכון שלך</td><td>—</td><td>—</td><td>${money(state.bank.balanceCents)}</td><td>${money(state.bank.balanceCents-state.settings.taxReserveCents)}</td></tr>${f.timeline.map(e=>`<tr><td>${dateLabel(e.date)}${e.originalDate&&e.originalDate<f.now?' *':''}</td><td>${esc(e.title)}</td><td class="green">${e.type==='income'?money(e.amountCents):'—'}</td><td class="red">${e.type==='expense'?money(e.amountCents):'—'}</td><td class="${e.balance<0?'red':''}">${money(e.balance)}</td><td class="${e.available<state.settings.bufferCents?'orange':''}">${money(e.available)}</td></tr>`).join('')}</tbody></table></div>${!f.timeline.length?'<div class="empty">אין תנועות צפויות בתקופה שנבחרה.</div>':''}<p class="hint">* חיוב שמועדו עבר ועדיין לא אושר. באותו יום ההוצאות מחושבות לפני ההכנסות, כדי להציג גם מחסור אפשרי במהלך היום.</p></div>`;}
function settingsPage(){
  const s=state.settings,goalProgress=s.goalCents?Math.min(100,Math.max(0,E.forecast(state,ui.days).conservativeSavings/s.goalCents*100)):0;
  return `<div class="two"><div class="card"><h2>הבנק והכסף ששומרים בצד</h2><div class="summary-row"><span>יתרה לפי העדכון שלך</span><b>${state.bank.verified?money(state.bank.balanceCents):'טרם הוזנה'}</b></div><div class="summary-row"><span>כרית ביטחון</span><b>${money(s.bufferCents)}</b></div><div class="summary-row"><span>רזרבה נוכחית למס</span><b>${money(s.taxReserveCents)}</b></div><div class="summary-row"><span>הפרשה מהכנסות חדשות</span><b>${s.taxBasisPoints/100}%</b></div><div class="summary-row"><span>יום חיוב אשראי ברירת מחדל</span><b>${s.creditDay}</b></div><div class="flex" style="margin-top:15px">${button('עדכון יתרה','bank','','primary')}${button('עריכת הגדרות','preferences')}</div><p class="hint">רזרבה למס היא כסף בתוך החשבון הזה. אל תכלול כסף שכבר נמצא בחשבון מס נפרד. תשלומי מס שהזנת כהוצאות כבר מופחתים מהתזרים; התאם את הרזרבה כך שלא תשריין את אותו כסף פעמיים. האחוז הוא בחירה שלך ואינו חישוב של חבות מס.</p></div>
  <div class="card"><h2>יעד חיסכון לתקופה</h2><div class="summary-row"><span>היעד שבחרת</span><b>${money(s.goalCents)}</b></div><p class="hint">מראה כמה מהיעד ניתן לכסות כרגע מתוך הכסף הפנוי ב־${ui.days} יום. אינו סופר חיסכון שכבר הועבר לחשבון אחר.</p><div class="progress" role="progressbar" aria-valuenow="${Math.round(goalProgress)}" aria-valuemin="0" aria-valuemax="100" aria-label="כסף פנוי ביחס ליעד"><span style="width:${goalProgress}%"></span></div><p class="hint">${Math.round(goalProgress)}% מהיעד זמין לפי הנתונים.</p>${button('עריכת יעד','preferences')}</div></div>
  <div class="card"><h2>גיבוי והעברת מידע</h2><div class="flex" style="flex-wrap:wrap">${button('הורדת גיבוי JSON','export-json','','primary')}${button('הורדת CSV','export-csv')}${button('ייבוא גיבוי','import-json')}${mode==='cloud'?button('ייבוא המידע מהמכשיר','import-local'):''}${button('שחזור מהאתר הישן','recover-legacy')}${button('ייצוא כל הקוד של האתר','download-source')}</div><p class="hint">ייבוא מהאתר הישן והעברה מהמכשיר מוסיפים רשומות בלי למחוק מידע קיים. ייבוא גיבוי מלא מהגרסה החדשה מחליף את הנתונים הפעילים; הורד גיבוי לפניו. אפשר לייבא גם JSON מהאתר הישן; תידרש יתרת בנק חדשה. קובץ הקוד לבדו אינו מכיל את הנתונים האישיים שהזנת.</p></div>
  <div class="card"><h2>חיבור לחשבון וסנכרון</h2>${mode==='cloud'?`<p class="hint">מחובר: ${esc(user?.email||'')} · המידע נשמר בחשבון שלך.</p><div class="flex">${button('התנתקות','logout')}${button('הורדת המידע מהאתר הישן','legacy-cloud')}</div>`:`<p class="hint">${mode==='demo'?'זו תצוגת דוגמה. הנתונים בה אינם נשמרים.':'המידע נשמר כרגע בדפדפן הזה. מומלץ להוריד גיבוי.'} אפשר להתחבר באמצעות אימייל וסיסמה לאחר הפעלת Firebase Authentication.</p>${button('התחברות / יצירת חשבון','login','','primary')}`}
  <details style="margin-top:18px"><summary>הוראות חיבור Firebase והעברת המידע הישן</summary><div class="hint"><ol><li>בפרויקט Firebase שלך, פתח Authentication → Sign-in method והפעל Email/Password.</li><li>ב־Authentication → Settings → Authorized domains הוסף את הדומיין של האתר. בעת בדיקה מקומית אפשר להוסיף localhost.</li><li>לפני שינוי ההרשאות, הורד JSON של הנתונים הישנים דרך Realtime Database → ⋮ → Export JSON. המידע הישן נמצא תחת appData. שמור גיבוי במקום בטוח.</li><li>ב־Realtime Database → Rules החלף את הכללים בכללים שלמטה ולחץ Publish. הנתיב הישן appData ייחסם; הנתונים החדשים נשמרים בנפרד לכל משתמש.</li><li>פתח את האתר דרך HTTP/HTTPS, התחבר או צור חשבון, וייבא את הגיבוי דרך ההגדרות. לאחר הייבוא עדכן את היתרה הנוכחית בבנק ובדוק את תאריכי הירידה של האשראי.</li></ol><p>הגדרת Firebase שבקוד היא מהפרויקט המקורי שלך. אם החלפת פרויקט, עדכן את FIREBASE_CONFIG.</p><pre dir="ltr" style="overflow:auto;background:var(--input);padding:15px;border-radius:12px;font-size:12px;text-align:left">${esc(JSON.stringify(FIREBASE_RULES,null,2))}</pre>${button('הורדת כללי ההרשאות','download-rules')}<p><a href="https://firebase.google.com/docs/auth/web/password-auth" target="_blank" rel="noopener">מדריך Firebase להתחברות באימייל וסיסמה</a></p><p>אם הורדת נתונים מתוך הנתיב הישן לפני חסימתו, אפשר להשתמש גם בכפתור ״הורדת המידע מהאתר הישן״. הפעולה קוראת בלבד; היא אינה מוחקת או משנה את המידע הישן.</p></div></details></div>`;
}
function render(){ui.days=selectedDays();const f=E.forecast(state,ui.days);root.innerHTML=`<header class="brand"><div class="flex"><span class="brand-icon" aria-hidden="true">📷</span><div><h1>תזרים לצלם</h1><small>לדעת מה יש, ומה כבר מחויב</small></div></div><div class="flex"><span id="sync" class="badge" role="status">${esc(status)}</span>${mode==='demo'?button('יציאה מהדוגמה','exit-demo'):mode==='cloud'?button('החשבון שלי','account'):button('התחברות','login')}</div></header><nav class="tabs" aria-label="ניווט">${TABS.map(([key,label])=>button(label,'tab',`data-tab="${key}" ${ui.tab===key?'aria-current="page"':''}`,ui.tab===key?'active':'')).join('')}</nav>${mode==='demo'?'<p class="notice">נתוני דוגמה בלבד — אפשר לשנות ולנסות, והמידע האישי שלך נשאר שמור.</p>':''}<div class="section">${recoveryNotice()}${ui.tab==='dashboard'?dashboard(f):ui.tab==='income'?incomePage():ui.tab==='expenses'?expensePage():ui.tab==='forecast'?forecastPage(f):settingsPage()}</div><div class="footer">תזרים לצלם · סכומים בש״ח · תחזית לפי המידע שהזנת</div>`;if(busy)setBusy(true);}
</script>
<script>
function incomeForm(id){
  const i=state.incomes.find(x=>x.id===id)||{id:'',client:'',amountCents:0,date:E.today(),termDays:30,expectedDate:E.dueDate(E.today(),30),manualDate:false,status:'pending'};
  openModal(i.id?'עריכת הכנסה':'הכנסה חדשה',`<form class="form" data-form="income"><input type="hidden" name="id" value="${i.id}">${field('לקוח / תיאור העבודה','client',i.client,'text','required maxlength="500"')}${positiveInput('סכום שיתקבל בבנק (₪)','amount',i.amountCents?amountInput(i.amountCents):'',i.status==='paid'?'readonly':'')}<div class="fields">${field('תאריך הוצאת החשבונית','date',i.date,'date','required')}${selectField('תנאי תשלום','termDays',TERMS,i.termDays)}</div><label class="check"><input type="checkbox" name="manualDate" ${i.manualDate?'checked':''}>תאריך גבייה ידני</label>${field('תאריך צפוי לקבלת הכסף','expectedDate',i.expectedDate,'date',`required ${i.manualDate?'':'readonly'}`)}<p class="hint">שוטף +30/+60 מחושב כסוף חודש החשבונית ועוד מספר הימים המדויק. אפשר לעדכן ידנית לפי הסיכום עם הלקוח. גם תנאי מיידי נשמרים כממתינים לתשלום.${i.status==='paid'?'<br>לשינוי סכום ששולם, בטל קודם את סימון התשלום.':''}</p>${actionsEnd()}</form>`);
}
function expenseForm(id){
  const e=state.expenses.find(e=>e.id===id)||{id:'',desc:'',amountCents:0,purchaseDate:E.today(),chargeDate:E.creditDate(E.today(),state.settings.creditDay),kind:'once',count:3,everyMonths:1,endDate:null,category:CATEGORIES[0],scope:'עסקי',method:'אשראי',overrides:{}};
  const paid=state.receipts.some(r=>r.expenseId===e.id),financialLock=paid&&e.kind!=='monthly';
  openModal(e.id?'עריכת הוצאה / סדרה':'הוצאה חדשה',`<form class="form" data-form="expense"><input type="hidden" name="id" value="${e.id}">${field('תיאור ההוצאה','desc',e.desc,'text','required maxlength="500"')}${positiveInput('סכום (בתשלומים: כל הרכישה; בקבועה: בכל חיוב)','amount',e.amountCents?amountInput(e.amountCents):'',financialLock?'readonly':'')}<div class="fields">${field('תאריך הרכישה','purchaseDate',e.purchaseDate,'date','required')}${field('תאריך ירידה ראשון מהבנק','chargeDate',e.chargeDate,'date',`required ${paid?'readonly':''}`)}</div><div class="fields">${selectField('אמצעי תשלום','method',['אשראי','העברה','מזומן','הוראת קבע'],e.method)}${selectField('סוג הוצאה','kind',KIND,e.kind)}</div><div class="fields">${field('מספר תשלומים (רק ברכישה בתשלומים)','count',e.count,'number',`min="2" max="120" step="1" ${paid?'readonly':''}`)}${selectField('תדירות (רק בהוצאה קבועה)','everyMonths',[{value:1,label:'כל חודש'},{value:2,label:'כל חודשיים'},{value:3,label:'כל 3 חודשים'},{value:6,label:'כל חצי שנה'},{value:12,label:'כל שנה'}],e.everyMonths)}</div><div class="fields">${selectField('קטגוריה','category',CATEGORIES.includes(e.category)?CATEGORIES:[e.category,...CATEGORIES],e.category)}${selectField('תחום','scope',['עסקי','אישי'],e.scope)}</div>${field('תאריך סיום לקבועה (אפשר להשאיר ריק)','endDate',e.endDate||'','date')}<div class="flex">${button('חישוב לפי יום חיוב אשראי','credit-date')}</div><p class="hint">יום ברירת המחדל הוא ${state.settings.creditDay}; בדוק את התאריך מול פירוט האשראי. אפשר לערוך חיוב בודד בלשונית ״ממתין לחיוב״. ${paid?'חיובים שאושרו נשמרים כפי שהיו. כשיש חיובים שאושרו, אי אפשר לשנות את תחילת הסדרה, סוגה או תדירותה. שינוי סכום בהוצאה קבועה חל על חיובים שלא אושרו, מלבד חריגים שכבר ערכת.':''}</p>${actionsEnd()}</form>`);

async function importData(raw){

    await commit(s=>{const i=s.incomes.find(i=>i.id===id);if(id&&!i)throw Error('ההכנסה נמחקה');if(i?.status==='paid'&&amount!==i.amountCents)throw Error('בטל את סימון התשלום לפני שינוי הסכום');if(i)Object.assign(i,{client,amountCents:amount,date,termDays,manualDate:manual,expectedDate:expected});else s.incomes.push({id:uid(),client,amountCents:amount,date,termDays,manualDate:manual,expectedDate:expected,status:'pending'});},modalBase);
  }else if(type==='expense'){
    const id=get('id'),old=state.expenses.find(e=>e.id===id),paid=state.receipts.some(r=>r.expenseId===id),kind=paid?old.kind:get('kind'),everyMonths=kind==='monthly'?(paid?old.everyMonths:Number(get('everyMonths'))):1,count=kind==='installments'?Number(get('count')):1;
    const value={desc:get('desc'),amountCents:E.cents(get('amount')),purchaseDate:get('purchaseDate'),chargeDate:get('chargeDate'),kind,count,everyMonths,endDate:kind==='monthly'?(get('endDate')||null):null,category:get('category'),scope:get('scope'),method:get('method')};
    E.parseDate(value.purchaseDate);E.parseDate(value.chargeDate);if(value.endDate){E.parseDate(value.endDate);if(value.endDate<value.chargeDate)throw Error('תאריך הסיום לפני החיוב הראשון');}if(!value.desc)throw Error('יש להזין תיאור');if(kind==='installments')E.split(value.amountCents,count);
    await commit(s=>{const e=s.expenses.find(e=>e.id===id);if(id&&!e)throw Error('ההוצאה נמחקה');if(e&&s.receipts.some(r=>r.expenseId===id)){if(value.kind!==e.kind||value.chargeDate!==e.chargeDate||value.everyMonths!==e.everyMonths||value.count!==e.count)throw Error('אי אפשר לשנות את המבנה של סדרה עם חיובים שאושרו');if(e.kind!=='monthly'&&value.amountCents!==e.amountCents)throw Error('בטל קודם את סימון התשלום כדי לערוך את הסכום');}if(e)Object.assign(e,value);else s.expenses.push({id:uid(),...value,overrides:{}});},modalBase);
  }else if(type==='occurrence'){
    const key=get('key'),o=E.occurrences(state,E.addDays(E.today(),366)).find(o=>o.key===key),amount=E.cents(get('amount')),date=get('chargeDate');E.parseDate(date);if(!o)throw Error('החיוב אינו קיים');await commit(s=>{const e=s.expenses.find(e=>e.id===o.expenseId);e.overrides[String(o.index)]={amountCents:amount,chargeDate:date};},modalBase);
  }else if(type==='payment'){
    const paymentType=get('type'),taxAdded=paymentType==='income'?nonnegative(get('taxAdded')):0;
    await commit(s=>E.applyPayment(s,paymentType,get('id'),get('paidDate'),data.has('included'),E.today(),taxAdded),modalBase);
  }else if(type==='stop'){
    const id=get('id'),date=get('endDate');E.parseDate(date);await commit(s=>{const e=s.expenses.find(e=>e.id===id);if(!e)throw Error('הסדרה אינה קיימת');if(date<e.chargeDate)throw Error('בחר תאריך שאינו קודם לתחילת הסדרה. לביטול כל הסדרה השתמש במחיקה');e.endDate=date;},modalBase);
  }
  closeModal();toast('נשמר בהצלחה');
}
function onChange(e){const el=e.target,action=el.dataset.change;if(action){if(action==='income-range')ui.incomeRange=el.value;else if(action==='income-status')ui.incomeStatus=el.value;else if(action==='expense-status')ui.expenseStatus=el.value;else if(action==='expense-scope')ui.expenseScope=el.value;render();}
  const form=el.closest('[data-form=income]');if(form&&['date','termDays','manualDate'].includes(el.name)){const manual=form.elements.manualDate.checked;form.elements.expectedDate.readOnly=!manual;if(!manual)try{form.elements.expectedDate.value=E.dueDate(form.elements.date.value,Number(form.elements.termDays.value));}catch(e){toast(e.message);}}
}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn&&!busy)clickAction(btn).catch(e=>toast(e.message));});
document.addEventListener('change',onChange);
document.addEventListener('submit',e=>{if(!e.target.matches('[data-form]'))return;e.preventDefault();submitForm(e.target).catch(error=>toast(error.message));});
modal.addEventListener('cancel',event=>{if(busy){event.preventDefault();return;}modal.innerHTML='';});
window.addEventListener('storage',e=>{if(e.key===LOCAL_KEY&&mode==='local'){state=loadLocal();status='עודכן בחלונית אחרת';render();if(modal.open)toast('הנתונים השתנו בחלונית אחרת. פתח מחדש את הטופס לפני שמירה');}});
let lastDay=E.today();setInterval(()=>{const now=E.today();if(now!==lastDay){lastDay=now;render();}},60000);
// Read-only recovery from the exact project approved by the owner.
// The source database is never updated or cleared by this operation.
let recoveryPending=false,recoveryFailed=false;
function recoveryNotice(){
  if(mode==='demo')return '';
  const saved=loadRecoveryLocal();
  if(mode==='cloud'&&!state.incomes.length&&!state.expenses.length&&
     saved&&(saved.incomes.length||saved.expenses.length)){
    return `<div class="notice">המידע הקיים שמור במכשיר: ${saved.incomes.length} הכנסות ו־${saved.expenses.length} הוצאות. החשבון החדש עדיין ריק. ${button('העברת המידע לחשבון שלי','import-local','','primary')}</div>`;
  }
  if(state.legacyRecovery&&!state.bank.verified){
    const r=state.legacyRecovery;
    return `<div class="notice">שוחזרו ${r.incomeCount} הכנסות ו־${r.expenseCount} הוצאות מהאתר הישן. הן מופיעות בלשוניות ההכנסות וההוצאות.</div>`;
  }
  if(recoveryPending)return '<div class="notice">בודק את הנתונים הקיימים באתר הישן…</div>';
  if(recoveryFailed&&!saved?.legacyRecovery&&!state.legacyRecovery){
    return `<div class="notice">לא ניתן לטעון כרגע את המידע הישן. הנתונים במקור אינם משתנים. ${button('ניסיון שחזור נוסף','recover-legacy')}${button('ייבוא גיבוי JSON','import-json')}</div>`;
  }
  return '';
}
function loadRecoveryLocal(){
  try{const raw=localStorage.getItem(LOCAL_KEY);return raw?E.validate(JSON.parse(raw)):null;}
  catch(e){return null;}
}
async function recoverLegacy(force=false){
  if(recoveryPending||mode==='demo')return;
  const prior=loadRecoveryLocal();
  if(prior?.legacyRecovery?.source==='money-1d58a/appData'&&!force)return;
  recoveryPending=true;recoveryFailed=false;render();
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{
    const url=FIREBASE_CONFIG.databaseURL.replace(/\/$/,'')+'/appData.json';
    // A read-only request. No credentials or financial records are embedded in the source.
    const response=await fetch(url,{signal:controller.signal,cache:'no-store'});
    if(!response.ok)throw Error('לא ניתן לקרוא את הנתונים הישנים. אפשר לייבא את הגיבוי');
    const raw=await response.json();
    if(!raw||!('openingBalance' in raw))throw Error('לא נמצאו נתונים בפורמט של האתר הישן');
    const migrated=E.migrateLegacy(raw);
    // Re-read after the request so edits made while loading cannot be overwritten.
    const oldText=localStorage.getItem(LOCAL_KEY);
    const latest=oldText?E.validate(JSON.parse(oldText)):E.empty();
    // When already restored, keep edits/deletions and never insert source rows again.
    if(latest.legacyRecovery?.source==='money-1d58a/appData'){
      toast('המידע הישן כבר שוחזר ונשמר במכשיר');return;
    }
    const merged=E.mergeLegacy(latest,migrated);
    // Write immutable backups before changing the active local data.
    localStorage.setItem(LOCAL_KEY+'-original-backup',JSON.stringify(raw));
    if(oldText)localStorage.setItem(LOCAL_KEY+'-before-recovery',oldText);
    localStorage.setItem(LOCAL_KEY,JSON.stringify(merged));
    if(mode==='local'){state=merged;status='המידע הישן שוחזר ונשמר במכשיר';}
    ui.expenseStatus='series';
    toast(`שוחזרו ${migrated.incomes.length} הכנסות ו־${migrated.expenses.length} הוצאות`);
  }catch(e){recoveryFailed=true;toast(e.message||'השחזור לא הושלם. אפשר לייבא את הגיבוי');}
  finally{clearTimeout(timer);recoveryPending=false;render();}
}
// Restore an authenticated session. Recovery first preserves the owner's legacy records
// locally; moving them into a signed-in account requires the explicit transfer button.
let restoreSession=false;try{restoreSession=localStorage.getItem('cashflow-restore-session')==='1';}catch(e){}
if(restoreSession){mode='cloud';state=E.empty();status='משחזר חיבור לחשבון…';render();ensureFirebase().catch(()=>{mode='local';state=loadLocal();status='אין חיבור — מוצג מידע מהמכשיר';render();toast('לא ניתן לשחזר את החיבור לענן. התחבר שוב כשיחזור האינטרנט.');});}else render();
recoverLegacy();
</script>

function spendingDetail(){

function cashDetail(kind){
  const f=E.forecast(state,selectedDays());
  let title,rows,sign;
  if(kind==='paid'){
    title='מה כבר ירד החודש?';sign='−';
    rows=paidThisMonth(f.now).map(r=>({title:r.title,date:r.paidDate,amount:r.amountCents,note:'ירד לפי הרישום'}));
  }else if(kind==='income'){
    title=`מה צפוי להיכנס עד ${dateLabel(f.end)}?`;sign='+';
    rows=f.ins.map(i=>({title:i.client,date:i.expectedDate,amount:i.amountCents,note:'ממתין לתשלום'}));
  }else{
    title=`מה עוד צפוי לרדת עד ${dateLabel(f.end)}?`;sign='−';
    rows=f.outs.map(o=>({title:o.title,date:o.date,amount:o.amountCents,note:o.date<f.now?'מועד החיוב עבר — עדיין לא אושר':o.label}));
  }
  const total=rows.reduce((sum,r)=>sum+r.amount,0);
  const outside=kind==='expense'?E.occurrences(state,E.addDays(f.end,366)).filter(o=>o.date>f.end):[];
  const history=kind==='expense'?[...state.receipts].sort((a,b)=>b.paidDate.localeCompare(a.paidDate)):[];
  openModal(title,`<div class="summary-row"><span>${kind==='expense'?'עוד צפוי לרדת בתקופה שנבחרה':'סה״כ'}</span><strong class="cash-row-amount ${kind==='income'?'green':'red'}">${money(total)}</strong></div>
    ${rows.length?rows.map(r=>`<div class="row"><div class="row-main"><div class="row-title">${esc(r.title)}</div><div class="row-sub">${dateLabel(r.date)} · ${esc(r.note)}</div></div><b class="amount ${kind==='income'?'green':'red'}">${sign}${money(r.amount)}</b></div>`).join(''):'<div class="empty">אין תשלומים ברשימה הזאת.</div>'}
    ${outside.length?`<h3 style="margin-top:24px">חיובים אחרי התקופה שנבחרה</h3><p class="hint">החיובים הבאים אינם מופחתים בסכום הראשי לתקופה הזאת. אפשר להרחיב את התקופה בלוח הבקרה.</p>${outside.map(o=>`<div class="row"><div class="row-main"><div class="row-title">${esc(o.title)}</div><div class="row-sub">${dateLabel(o.date)} · ${esc(o.label)}</div></div><b class="amount red">${money(o.amountCents)}</b></div>`).join('')}`:''}
    ${history.length?`<h3 style="margin-top:24px">כבר ירד, לפי הרישומים</h3><p class="hint">החיובים האלה כבר כלולים ביתרת הבנק ואינם מופחתים ממנה שוב. ברשומות מהאתר הישן הסטטוס נקבע לפי התאריך; בדוק מול הבנק, ואם החיוב עדיין לא ירד, בטל את הסימון בלשונית ההוצאות.</p>${history.map(r=>`<div class="row"><div class="row-main"><div class="row-title">${esc(r.title)}</div><div class="row-sub">${dateLabel(r.paidDate)} · כבר כלול ביתרה</div></div><b class="amount">${money(r.amountCents)}</b></div>`).join('')}`:''}
    ${kind==='paid'?'<p class="hint">הרשימה מבוססת על חיובים שאושרו ועל הרישומים שהועברו מהאתר הישן. אפשר לבדוק ולתקן את סימון החיוב בלשונית ההוצאות.</p>':''}
    <div class="form-actions" style="margin-top:16px">${button('סגירה','close')}</div>`);
}
function rangeControl(value,action){return `<select class="filter" data-change="${action}" aria-label="סינון תקופה">${options([{value:'all',label:'כל הזמן'},{value:'month',label:'החודש'},{value:'year',label:'השנה'}],value)}</select>`;}
function inRange(date,range){const t=E.today();return range==='all'||date.startsWith(t.slice(0,range==='year'?4:7));}
function incomePage(){
  const list=state.incomes.filter(i=>inRange(i.status==='paid'?i.paidDate:i.date,ui.incomeRange)&&(ui.incomeStatus==='all'||i.status===ui.incomeStatus)).sort((a,b)=>(a.status==='paid'?a.paidDate:a.expectedDate).localeCompare(b.status==='paid'?b.paidDate:b.expectedDate));
  const paid=list.filter(i=>i.status==='paid').reduce((s,i)=>s+i.amountCents,0),pending=list.filter(i=>i.status==='pending').reduce((s,i)=>s+i.amountCents,0);

}
function expensePage(){
  const end=E.addDays(E.today(),366),all=E.occurrences(state,end),list=all.filter(o=>ui.expenseScope==='all'||o.scope===ui.expenseScope),history=state.receipts.filter(r=>ui.expenseScope==='all'||r.scope===ui.expenseScope).sort((a,b)=>b.paidDate.localeCompare(a.paidDate));
  return `<div class="card"><div class="card-head"><h2>חיובים והוצאות <small class="muted">(${state.expenses.length} רשומות)</small></h2>${button('+ הוצאה','new-expense','','primary')}</div><div class="summary-row total"><span>סך ההוצאות ברשימה — כל התאריכים</span><b class="red">${money(E.recordedExpenses(state).totalCents)}</b>${button('בדיקת כל השורות','recorded-expenses')}</div><p class="hint">רכישה ותאריך ירידה מהבנק הם שני תאריכים נפרדים. באשראי הזן את החיוב בפועל. כדי למנוע כפילות, בחר אם להזין חיוב אשראי כולל או את הרכישות המרכיבות אותו.</p><div class="filter-row"><select class="filter" data-change="expense-status" aria-label="סינון הוצאות">${options([{value:'pending',label:'ממתין לחיוב — שנה קדימה'},{value:'paid',label:'חיובים שאושרו'},{value:'series',label:'כל ההוצאות והסדרות'}],ui.expenseStatus)}</select><select class="filter" data-change="expense-scope" aria-label="תחום הוצאה">${options([{value:'all',label:'עסקי ואישי'},{value:'עסקי',label:'עסקי'},{value:'אישי',label:'אישי'}],ui.expenseScope)}</select></div><div class="list">${ui.expenseStatus==='pending'?(list.length?list.map(o=>`<div class="row"><div class="row-main"><div class="row-title">${esc(o.title)}</div><div class="row-sub">${dateLabel(o.date)} · ${esc(o.label)} · ${esc(o.category)} · ${esc(o.scope)}<br>${esc(o.method)} ${o.date<E.today()?'<span class="red">· מועד החיוב עבר, טרם אושר</span>':''}</div></div><div class="amount red">−${money(o.amountCents)}</div><div class="actions">${button('✓ ירד מהבנק','pay-expense',`data-id="${o.key}"`)}${button('עריכת חיוב','edit-occurrence',`data-id="${o.key}"`)}${button('ביטול חיוב','cancel-occurrence',`data-id="${o.key}"`,'danger')}</div></div>`).join(''):'<div class="empty">אין חיובים ממתינים לשנה הקרובה.</div>'):ui.expenseStatus==='paid'?(history.length?history.map(r=>`<div class="row"><div class="row-main"><div class="row-title">${esc(r.title)}</div><div class="row-sub">ירד: ${dateLabel(r.paidDate)} · ${esc(r.category||'כללי')} · ${esc(r.scope||'עסקי')}</div></div><div class="amount red">−${money(r.amountCents)}</div><div class="actions">${button('ביטול סימון','undo-expense',`data-id="${r.key}"`)}</div></div>`).join(''):'<div class="empty">אין חיובים שאושרו.</div>'):renderSeries()}</div></div>`;
}
function renderSeries(){const list=state.expenses.filter(e=>ui.expenseScope==='all'||e.scope===ui.expenseScope);return list.length?list.map(e=>`<div class="row"><div class="row-main"><div class="row-title">${esc(e.desc)}</div><div class="row-sub">${esc(e.legacyInstallmentInfo?'תשלום '+e.legacyInstallmentInfo:KIND.find(k=>k.value===e.kind)?.label)} · חיוב ראשון: ${dateLabel(e.chargeDate)} · ${esc(e.scope)}${e.kind==='installments'?` · ${e.count} תשלומים`:''}${e.endDate?` · מסתיים: ${dateLabel(e.endDate)}`:''}<br>${e.kind==='installments'?'סכום הרכישה הכולל':e.kind==='monthly'?'סכום בכל חיוב':'סכום החיוב'}: ${money(e.amountCents)}</div></div><div class="actions">${button('עריכת סדרה','edit-expense',`data-id="${e.id}"`)}${e.kind==='monthly'?button('סיום סדרה','stop-series',`data-id="${e.id}"`):''}${button('מחיקת סדרה','delete-expense',`data-id="${e.id}"`,'danger')}</div></div>`).join(''):'<div class="empty">עדיין אין הוצאות. הוסף חד־פעמיות, תשלומים או הוצאות קבועות.</div>';}
function storagePanel(){
  return `  <div class="card"><h2>גיבוי והעברת מידע</h2><div class="flex" style="flex-wrap:wrap">${button('הורדת גיבוי JSON','export-json','','primary')}${button('הורדת CSV','export-csv')}${button('ייבוא גיבוי','import-json')}${button('שחזור מהאתר הישן','recover-legacy')}${button('ייצוא כל הקוד של האתר','download-source')}</div><p class="hint">ייבוא מהאתר הישן והעברה מהמכשיר מוסיפים רשומות בלי למחוק מידע קיים. ייבוא גיבוי מלא מהגרסה החדשה מחליף את הנתונים הפעילים; הורד גיבוי לפניו. אפשר לייבא גם JSON מהאתר הישן; תידרש יתרת בנק חדשה. קובץ הקוד לבדו אינו מכיל את הנתונים האישיים שהזנת.</p></div>
  <div class="card"><h2>שמירה בלי הרשמה</h2><p class="hint">${mode==='cloud'?(cloudReady?'המידע מסונכרן לשמירה פרטית בענן. עותק אחרון נשמר גם בדפדפן.':'מוצג עותק אחרון מהמכשיר. החיבור לענן עדיין אינו זמין.'):mode==='demo'?'נתוני הדוגמה אינם נשמרים.':'המידע נשמר אוטומטית בדפדפן הזה. אין צורך במשתמש או בסיסמה כדי להשתמש באתר.'}</p>
    <div class="flex">${button(mode==='cloud'?'בדיקה מחדש של השמירה בענן':'חיבור לשמירה פרטית בענן','connect-secure','','primary')}${button('גיבוי מוצפן עם סיסמה','encrypted-backup')}</div>
    <p class="hint">שמירה בענן משתמשת בזיהוי אוטומטי של הדפדפן, בלי מסכי התחברות. מחיקת נתוני הדפדפן עלולה למחוק את מפתח הגישה: שמור גם גיבוי כדי שתוכל לשחזר במכשיר אחר. השמירה המקומית הרגילה אינה מוצפנת; לגיבוי מוצפן יש סיסמה שאתה בוחר.</p>
    <details style="margin-top:18px"><summary>הגדרה חד־פעמית לשמירה מוגנת בענן</summary><div class="hint"><ol><li>לפני שינוי הכללים, הורד גיבוי JSON של ההכנסות וההוצאות דרך הכפתור למעלה. כך אפשר לשחזר גם אם הנתיב הישן נחסם.</li><li>ב־Firebase → Authentication → Sign-in method הפעל Anonymous. אין צורך להפעיל הרשמה באימייל.</li><li>ב־Realtime Database → Rules הדבק את הכללים שלמטה ולחץ Publish. הם חוסמים גישה ציבורית וגם את הנתיב הישן appData. הנתונים במקור אינם נמחקים.</li><li>פתח את האתר דרך HTTPS או localhost ולחץ ״חיבור לשמירה פרטית בענן״. הנתונים שכבר הזנת יועברו אוטומטית בלי למחוק רשומות קיימות.</li></ol><p>הקוד לא יכול לשנות את כללי Firebase בעצמו. עד להפעלתם, הנתונים במאגר הישן עלולים להישאר נגישים לפי הכללים הישנים. האתר לא יתחיל לכתוב לענן אם בדיקת הקריאה ללא זיהוי מצליחה.</p><pre dir="ltr" style="overflow:auto;background:var(--input);padding:15px;border-radius:12px;font-size:12px;text-align:left">${esc(JSON.stringify(FIREBASE_RULES,null,2))}</pre>${button('הורדת כללי ההרשאות','download-rules')}<p><a href="https://firebase.google.com/docs/auth/web/anonymous-auth" target="_blank" rel="noopener">הגדרת הזיהוי האוטומטי ב־Firebase</a></p></div></details>
    ${recoveryNotice()}
  </div>`;
}
function render(){
  ui.days=selectedDays();if(!TABS.some(([tab])=>tab===ui.tab))ui.tab='dashboard';
  root.innerHTML=`<header class="brand"><div class="flex"><span class="brand-icon" aria-hidden="true">📷</span><div><h1>תזרים לצלם</h1><small>הכסף שלך, ברור.</small></div></div><div class="flex"><span id="sync" class="badge" role="status">${esc(status)}</span>${button('גיבוי','storage')}${mode==='demo'?button('יציאה מהדוגמה','exit-demo'):''}</div></header><nav class="tabs" aria-label="ניווט">${TABS.map(([key,label])=>button(label,'tab',`data-tab="${key}" ${ui.tab===key?'aria-current="page"':''}`,ui.tab===key?'active':'')).join('')}</nav>${mode==='demo'?'<p class="notice">נתוני דוגמה בלבד. המידע האישי שלך נשאר שמור.</p>':''}<div class="section">${ui.tab==='income'?incomePage():ui.tab==='expenses'?expensePage():dashboard()}</div><div class="footer">תזרים לצלם · סכומים בש״ח · מחושב לפי הרישומים שלך</div>`;if(busy)setBusy(true);
}

function nonnegative(v){return String(v).trim()==='0'||/^0\.0{1,2}$/.test(String(v))?0:E.cents(v);}
function download(name,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function csvCell(v){let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCSV(){const rows=[['סוג','תיאור','תאריך רכישה / חשבונית','מועד תזרים','סכום ₪','סטטוס','תחום / הערה']];for(const i of state.incomes)rows.push(['הכנסה',i.client,i.date,i.status==='paid'?i.paidDate:i.expectedDate,amountInput(i.amountCents),i.status==='paid'?'שולם':'ממתין','']);for(const o of E.occurrences(state,E.addDays(E.today(),366)))rows.push(['הוצאה',o.title,state.expenses.find(e=>e.id===o.expenseId)?.purchaseDate,o.date,amountInput(o.amountCents),'ממתין לחיוב',o.scope+' · '+o.label]);for(const r of state.receipts)rows.push(['הוצאה',r.title,'',r.paidDate,amountInput(r.amountCents),'ירד',r.scope||'']);download(`cashflow-${E.today()}.csv`,'\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function exportSource(){const copy=document.documentElement.cloneNode(true);copy.querySelector('#app').textContent='';copy.querySelector('#modal').textContent='';copy.querySelector('#modal').removeAttribute('open');copy.querySelector('#toast').textContent='';download('index.html','<!DOCTYPE html>\n'+copy.outerHTML,'text/html;charset=utf-8');}
async function importData(raw){
  const source=raw.appData||raw,legacy=source.schemaVersion!==2;
  const imported=legacy?E.migrateLegacy(source):E.validate(source);
  const question=legacy?
    'להוסיף את ההכנסות וההוצאות מהגיבוי הישן? הנתונים הקיימים יישמרו, ורשומות שכבר שוחזרו לא יוכפלו. לאחר מכן בדוק את יתרת הבנק ואת תאריכי חיוב האשראי.':
    `הייבוא יחליף את המידע הפעיל ${mode==='cloud'?'בענן הפרטי':'בדפדפן הזה'}. הורדת גיבוי?`;
  if(!confirm(question))return;
  await commit(draft=>{
    if(legacy){Object.assign(draft,E.mergeLegacy(draft,imported));}
    else{const revision=draft.revision;Object.keys(draft).forEach(k=>delete draft[k]);Object.assign(draft,imported,{revision});}
  });
  ui.expenseStatus='series';render();
  toast(legacy?'ההכנסות וההוצאות הישנות נוספו ונשמרו':'הגיבוי יובא בהצלחה');
  if(legacy&&!state.bank.verified)bankForm();
}
function pickImport(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.addEventListener('change',async()=>{const file=input.files[0];if(!file)return;try{if(file.size>10000000)throw Error('הגיבוי גדול מ־10MB');const raw=JSON.parse(await file.text());if(raw.format==='cashflow-encrypted-v1'){pendingEncryptedBackup=raw;openModal('פתיחת הגיבוי המוצפן',`<form class="form" data-form="unlock-backup">${field('סיסמת הגיבוי','backupPassword','','password','required autocomplete="off"')}<p class="hint">סיסמה שגויה לא משנה את הנתונים שלך.</p>${actionsEnd()}</form>`);}else await importData(raw);}catch(e){toast('הייבוא נכשל: '+e.message);}});input.click();}
function demo(){if(mode==='cloud')throw Error('הדוגמה זמינה כשהשמירה מקומית');mode='demo';state=E.empty();E.reconcile(state,1250000);state.settings.bufferCents=300000;state.settings.taxReserveCents=100000;state.settings.taxBasisPoints=1500;state.settings.goalCents=500000;const t=E.today();state.incomes=[{id:'demo_income_1',client:'צילום פרסומת — לקוח א׳',amountCents:800000,date:t,termDays:30,manualDate:true,expectedDate:E.addDays(t,25),status:'pending'},{id:'demo_income_2',client:'צילום מוצר — לקוח ב׳',amountCents:350000,date:E.addDays(t,-40),termDays:30,manualDate:true,expectedDate:E.addDays(t,-4),status:'pending'}];state.expenses=[{id:'demo_rent',desc:'העברה לחשבון המשותף',amountCents:430000,purchaseDate:t,chargeDate:E.addDays(t,8),kind:'monthly',everyMonths:1,count:1,endDate:null,category:'שכירות וחשבונות',scope:'אישי',method:'העברה',overrides:{}},{id:'demo_adobe',desc:'תוכנות עריכה',amountCents:23000,purchaseDate:t,chargeDate:E.addDays(t,12),kind:'monthly',everyMonths:1,count:1,endDate:null,category:'תוכנות ומנויים',scope:'עסקי',method:'אשראי',overrides:{}},{id:'demo_camera',desc:'עדשה חדשה',amountCents:600001,purchaseDate:t,chargeDate:E.addDays(t,18),kind:'installments',everyMonths:1,count:6,endDate:null,category:'ציוד ועדשות',scope:'עסקי',method:'אשראי',overrides:{}}];ui.tab='dashboard';status='תצוגת דוגמה — ללא שמירה';render();}
let firebaseLoading=null,secureConnecting=false,pendingEncryptedBackup=null;
function cacheCloud(value){
  try{localStorage.setItem(LOCAL_KEY,JSON.stringify(value));}
  catch(e){toast('נשמר בענן, אך העותק במכשיר לא עודכן. כדאי להוריד גיבוי.');}
}
async function assertPrivateRead(uid){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
  try{
    const response=await fetch(FIREBASE_CONFIG.databaseURL.replace(/\/$/,'')+`/users/${encodeURIComponent(uid)}/appData.json?shallow=true`,{cache:'no-store',credentials:'omit',signal:controller.signal});
    if(response.status!==401&&response.status!==403)throw Error('הענן עדיין אינו מוגן או שלא ניתן לבדוק אותו. פרסם את כללי ההרשאות שבחלון גיבוי ואז נסה שוב.');
  }finally{clearTimeout(timer);}
}
async function ensureFirebase(){
  if(fb)return fb;if(firebaseLoading)return firebaseLoading;
  firebaseLoading=(async()=>{
    const base='https://www.gstatic.com/firebasejs/10.8.0/';
    const [app,auth,db]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-database.js')]);
    const firebaseApp=app.initializeApp(FIREBASE_CONFIG),authentication=auth.getAuth(firebaseApp);
    await auth.setPersistence(authentication,auth.browserLocalPersistence);
    fb={app:firebaseApp,auth,db,authentication,database:db.getDatabase(firebaseApp)};
    return fb;
  })();
  try{return await firebaseLoading;}finally{firebaseLoading=null;}
}
async function connectSecure(){
  if(secureConnecting||busy||mode==='demo')return;
  secureConnecting=true;busy=true;cloudReady=false;
  const generation=++authGeneration;if(unsub){unsub();unsub=null;}
  status='בודק שמירה פרטית…';render();
  try{
    if(recoveryPending)throw Error('הנתונים הישנים עדיין נטענים. נסה שוב לאחר השחזור.');
    if(!navigator.onLine)throw Error('אין אינטרנט. הנתונים במכשיר נשארים שמורים.');
    const f=await ensureFirebase();
    // Reuse any existing Firebase session, so previously saved records stay accessible.
    await new Promise((resolve,reject)=>{let stop;stop=f.auth.onAuthStateChanged(f.authentication,()=>{resolve();setTimeout(()=>stop?.(),0);},reject);});
    const currentUser=f.authentication.currentUser||(await f.auth.signInAnonymously(f.authentication)).user;
    await assertPrivateRead(currentUser.uid);
    const ref=f.db.ref(f.database,`users/${currentUser.uid}/appData`);
    const marker=LOCAL_KEY+'-cloud-imported-'+currentUser.uid;
    const source=clone(state),sourceRevision=state.revision,firstTransfer=!localStorage.getItem(marker);
    let loaded;
    if(firstTransfer){
      const result=await f.db.runTransaction(ref,remote=>{
        const destination=remote?E.validate(remote):E.empty();
        const merged=E.mergeLegacy(destination,source);merged.revision=destination.revision+1;return merged;
      },{applyLocally:false});
      if(!result.committed)throw Error('המידע לא הועבר. הנתונים במכשיר נשארו שמורים.');
      loaded=E.validate(result.snapshot.val());
    }else{
      // A reconnect reads only. Never recreate a missing remote from an empty SDK cache.
      const snapshot=await f.db.get(ref);
      if(!snapshot.exists())throw Error('הנתונים בענן חסרים. העותק במכשיר נשמר; אפשר לשחזר גיבוי דרך ההגדרות.');
      loaded=E.validate(snapshot.val());
    }
    if(mode==='local'&&state.revision!==sourceRevision)throw Error('נוסף מידע במכשיר בזמן החיבור. נסה שוב כדי להעביר גם אותו.');
    localStorage.setItem(marker,'1');localStorage.setItem('cashflow-secure-enabled','1');
    localStorage.setItem('cashflow-restore-session','1');
    user=currentUser;mode='cloud';state=loaded;cloudReady=true;cacheCloud(state);status='נשמר בענן הפרטי';render();
    unsub=f.db.onValue(ref,snapshot=>{
      if(generation!==authGeneration)return;
      try{if(!snapshot.exists())throw Error('הנתונים בענן חסרים. העותק במכשיר נשמר');state=E.validate(snapshot.val());cloudReady=true;cacheCloud(state);status=navigator.onLine?'נשמר בענן הפרטי':'אין אינטרנט — מוצג עותק אחרון';render();}
      catch(e){cloudReady=false;status='לא ניתן לטעון מהענן';toast(e.message);render();}
    },()=>{if(generation!==authGeneration)return;cloudReady=false;status='אין גישה לענן — מוצג עותק אחרון';toast('המידע במכשיר נשמר. בדוק את כללי Firebase ונסה לחבר שוב את השמירה.');render();});
    toast('השמירה הפרטית מחוברת. אין צורך בהרשמה.');
  }catch(e){
    status=mode==='cloud'?'אין גישה לענן — מוצג עותק אחרון':'נשמר במכשיר — הענן לא מחובר';render();
    toast(e.code==='auth/operation-not-allowed'?'הפעל Anonymous ב־Firebase Authentication, כפי שמוסבר בחלון גיבוי.':e.message||'לא ניתן להתחבר. המידע נשאר שמור במכשיר.');
  }finally{secureConnecting=false;busy=false;setBusy(false);}
}
function encryptedBackupForm(){
  if(!crypto.subtle)throw Error('גיבוי מוצפן דורש HTTPS או localhost');
  openModal('גיבוי מוצפן — בלי חשבון',`<form class="form" data-form="encrypted-backup">${field('סיסמה לגיבוי (לפחות 10 תווים)','backupPassword','','password','required minlength="10" autocomplete="new-password"')}${field('הקלדת הסיסמה שוב','backupRepeat','','password','required minlength="10" autocomplete="new-password"')}<p class="hint">הסיסמה מצפינה את כל ההכנסות וההוצאות בקובץ. היא אינה נשלחת לשום שרת. אי אפשר לפתוח את הגיבוי בלי הסיסמה.</p>${actionsEnd()}</form>`);
}
function encode64(bytes){let text='';for(const b of bytes)text+=String.fromCharCode(b);return btoa(text);}
function decode64(text){if(typeof text!=='string'||text.length>14000000)throw Error('מבנה גיבוי לא תקין');return Uint8Array.from(atob(text),c=>c.charCodeAt(0));}
async function backupKey(password,salt){
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptBackup(value,password){
  if(!crypto.subtle)throw Error('הצפנה דורשת HTTPS או localhost');
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await backupKey(password,salt),data=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:new TextEncoder().encode('cashflow-encrypted-v1')},key,new TextEncoder().encode(JSON.stringify(value)));
  return {format:'cashflow-encrypted-v1',cipher:'AES-256-GCM',kdf:'PBKDF2-SHA256',iterations:600000,salt:encode64(salt),iv:encode64(iv),data:encode64(new Uint8Array(data))};
}
async function decryptBackup(raw,password){
  if(!crypto.subtle)throw Error('פתיחת גיבוי מוצפן דורשת HTTPS או localhost');
  if(!raw||raw.format!=='cashflow-encrypted-v1'||raw.cipher!=='AES-256-GCM'||raw.kdf!=='PBKDF2-SHA256'||raw.iterations!==600000)throw Error('פורמט ההצפנה אינו נתמך');
  const salt=decode64(raw.salt),iv=decode64(raw.iv);if(salt.length!==16||iv.length!==12)throw Error('מבנה הגיבוי לא תקין');
  try{const key=await backupKey(password,salt),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:new TextEncoder().encode(raw.format)},key,decode64(raw.data));return E.validate(JSON.parse(new TextDecoder().decode(plain)));}
  catch(e){throw Error('סיסמה שגויה או קובץ פגום. הנתונים הקיימים לא השתנו.');}
}
async function clickAction(btn){

    if(confirm(`לבטל את סימון התשלום? ${estimated?'היתרה המחושבת תתעדכן יחד עם ביטול הרישום.':delta?'השינוי שבוצע ליתרת הבנק בסימון זה יבוטל גם הוא.':'יתרת הבנק לא תשתנה, כי התשלום כבר נכלל בעדכון יתרה או סומן ככלול.'}`))await commit(s=>E.undoPayment(s,type,id));
  }else if(a==='delete-income'){if(confirm('למחוק את רישום ההכנסה? יתרת הבנק והרזרבה למס לא ישתנו.'))await commit(s=>{const i=s.incomes.find(i=>i.id===id);if(E.cashPosition(s).estimated&&i?.status==='paid')s.bank.legacyAdjustmentCents=(s.bank.legacyAdjustmentCents||0)+i.amountCents;s.incomes=s.incomes.filter(i=>i.id!==id);});}
  else if(a==='delete-expense'){if(confirm('למחוק את כל הסדרה ולבטל את החיובים שטרם אושרו? חיובים שאושרו נשמרים בהיסטוריה. יתרת הבנק לא תשתנה.'))await commit(s=>s.expenses=s.expenses.filter(e=>e.id!==id));}
  else if(a==='cancel-occurrence'){const o=E.occurrences(state,E.addDays(E.today(),366)).find(o=>o.key===id);if(!o)throw Error('החיוב אינו קיים');if(confirm('לבטל רק את החיוב הזה מהתחזית? ביטול ברישום אינו מבטל התחייבות מול הספק.'))await commit(s=>{const e=s.expenses.find(e=>e.id===o.expenseId);e.overrides[String(o.index)]={...(e.overrides[String(o.index)]||{}),canceled:true};});}
  else if(a==='stop-series')stopSeries(id);
  else if(a==='credit-date'){const f=modal.querySelector('form');if(f?.dataset.form!=='expense')return;if(f.elements.chargeDate.readOnly)throw Error('אי אפשר להזיז סדרה עם חיובים שאושרו');f.elements.chargeDate.value=E.creditDate(f.elements.purchaseDate.value,state.settings.creditDay);}
  else if(a==='export-json')download(`cashflow-${E.today()}.json`,JSON.stringify(state,null,2));else if(a==='export-csv')exportCSV();else if(a==='download-source')exportSource();else if(a==='download-rules')download('database.rules.json',JSON.stringify(FIREBASE_RULES,null,2));
  else if(a==='recover-legacy')await recoverLegacy(true);else if(a==='import-json')pickImport();
  else if(a==='demo')demo();else if(a==='exit-demo'){mode='local';state=loadLocal();status='נשמר במכשיר';render();}
  else if(a==='connect-secure')await connectSecure();
  else if(a==='encrypted-backup')encryptedBackupForm();
  else if(a==='spending-detail')spendingDetail();
  else if(a==='all-commitments')allCommitmentsDetail();
  else if(a==='cash-reserves')cashReserveForm();
  else if(a==='storage')openModal('גיבוי ושמירה',storagePanel());
}
async function submitForm(form){
  const data=new FormData(form),get=n=>String(data.get(n)||'').trim(),type=form.dataset.form;
  if(type==='encrypted-backup'){
    const password=get('backupPassword');if(password.length<10)throw Error('בחר סיסמה של לפחות 10 תווים');
    if(password!==get('backupRepeat'))throw Error('הסיסמאות אינן זהות');
    const encrypted=await encryptBackup(state,password);download(`cashflow-encrypted-${E.today()}.json`,JSON.stringify(encrypted,null,2));closeModal();toast('הגיבוי המוצפן הורד. שמור את הסיסמה בנפרד');return;
  }
  if(type==='unlock-backup'){
    const restored=await decryptBackup(pendingEncryptedBackup,get('backupPassword'));await importData(restored);closeModal();pendingEncryptedBackup=null;return;
  }
  if(type==='cash-reserves'){const buffer=nonnegative(get('buffer')),reserve=nonnegative(get('reserve'));await commit(s=>{if(reserve!==s.settings.taxReserveCents)s.settings.reserveEpoch++;s.settings.bufferCents=buffer;s.settings.taxReserveCents=reserve;},modalBase);}
  else if(type==='bank'){const amount=E.cents(get('balance'),true);await commit(s=>E.reconcile(s,amount),modalBase);}
  else if(type==='preferences'){
    const buffer=nonnegative(get('buffer')),reserve=nonnegative(get('reserve')),goal=nonnegative(get('goal')),tax=Number(get('taxPercent')),day=Number(get('creditDay'));if(!Number.isFinite(tax)||tax<0||tax>100||!Number.isInteger(day)||day<1||day>31)throw Error('בדוק את האחוז ואת יום החיוב');
    await commit(s=>{if(reserve!==s.settings.taxReserveCents)s.settings.reserveEpoch=(s.settings.reserveEpoch||0)+1;Object.assign(s.settings,{bufferCents:buffer,taxReserveCents:reserve,taxBasisPoints:Math.round(tax*100),creditDay:day,goalCents:goal});},modalBase);
  }else if(type==='income'){
    const id=get('id'),date=get('date'),termDays=Number(get('termDays')),manual=data.has('manualDate'),amount=E.cents(get('amount')),client=get('client'),expected=manual?get('expectedDate'):E.dueDate(date,termDays);E.parseDate(date);E.parseDate(expected);if(!client)throw Error('יש להזין לקוח');
    await commit(s=>{const i=s.incomes.find(i=>i.id===id);if(id&&!i)throw Error('ההכנסה נמחקה');if(i?.status==='paid'&&amount!==i.amountCents)throw Error('בטל את סימון התשלום לפני שינוי הסכום');if(i)Object.assign(i,{client,amountCents:amount,date,termDays,manualDate:manual,expectedDate:expected});else s.incomes.push({id:uid(),client,amountCents:amount,date,termDays,manualDate:manual,expectedDate:expected,status:'pending'});},modalBase);
  }else if(type==='expense'){
    const id=get('id'),old=state.expenses.find(e=>e.id===id),paid=state.receipts.some(r=>r.expenseId===id),kind=paid?old.kind:get('kind'),everyMonths=kind==='monthly'?(paid?old.everyMonths:Number(get('everyMonths'))):1,count=kind==='installments'?Number(get('count')):1;
    const value={desc:get('desc'),amountCents:E.cents(get('amount')),purchaseDate:get('purchaseDate'),chargeDate:get('chargeDate'),kind,count,everyMonths,endDate:kind==='monthly'?(get('endDate')||null):null,category:get('category'),scope:get('scope'),method:get('method')};
    E.parseDate(value.purchaseDate);E.parseDate(value.chargeDate);if(value.endDate){E.parseDate(value.endDate);if(value.endDate<value.chargeDate)throw Error('תאריך הסיום לפני החיוב הראשון');}if(!value.desc)throw Error('יש להזין תיאור');if(kind==='installments')E.split(value.amountCents,count);
    await commit(s=>{const e=s.expenses.find(e=>e.id===id);if(id&&!e)throw Error('ההוצאה נמחקה');if(e&&s.receipts.some(r=>r.expenseId===id)){if(value.kind!==e.kind||value.chargeDate!==e.chargeDate||value.everyMonths!==e.everyMonths||value.count!==e.count)throw Error('אי אפשר לשנות את המבנה של סדרה עם חיובים שאושרו');if(e.kind!=='monthly'&&value.amountCents!==e.amountCents)throw Error('בטל קודם את סימון התשלום כדי לערוך את הסכום');}if(e)Object.assign(e,value);else s.expenses.push({id:uid(),...value,overrides:{}});},modalBase);
  }else if(type==='occurrence'){
    const key=get('key'),o=E.occurrences(state,E.addDays(E.today(),366)).find(o=>o.key===key),amount=E.cents(get('amount')),date=get('chargeDate');E.parseDate(date);if(!o)throw Error('החיוב אינו קיים');await commit(s=>{const e=s.expenses.find(e=>e.id===o.expenseId);e.overrides[String(o.index)]={amountCents:amount,chargeDate:date};},modalBase);
  }else if(type==='payment'){
    const paymentType=get('type'),taxAdded=paymentType==='income'?nonnegative(get('taxAdded')):0;
    await commit(s=>E.applyPayment(s,paymentType,get('id'),get('paidDate'),data.has('included'),E.today(),taxAdded),modalBase);
  }else if(type==='stop'){
    const id=get('id'),date=get('endDate');E.parseDate(date);await commit(s=>{const e=s.expenses.find(e=>e.id===id);if(!e)throw Error('הסדרה אינה קיימת');if(date<e.chargeDate)throw Error('בחר תאריך שאינו קודם לתחילת הסדרה. לביטול כל הסדרה השתמש במחיקה');e.endDate=date;},modalBase);
  }
  closeModal();toast('נשמר בהצלחה');
}
function onChange(e){const el=e.target,action=el.dataset.change;if(action){if(action==='income-range')ui.incomeRange=el.value;else if(action==='income-status')ui.incomeStatus=el.value;else if(action==='expense-status')ui.expenseStatus=el.value;else if(action==='expense-scope')ui.expenseScope=el.value;render();}
  const form=el.closest('[data-form=income]');if(form&&['date','termDays','manualDate'].includes(el.name)){const manual=form.elements.manualDate.checked;form.elements.expectedDate.readOnly=!manual;if(!manual)try{form.elements.expectedDate.value=E.dueDate(form.elements.date.value,Number(form.elements.termDays.value));}catch(e){toast(e.message);}}
}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn&&!busy)clickAction(btn).catch(e=>toast(e.message));});
document.addEventListener('change',onChange);
document.addEventListener('submit',e=>{if(!e.target.matches('[data-form]'))return;e.preventDefault();submitForm(e.target).catch(error=>toast(error.message));});
modal.addEventListener('cancel',event=>{if(busy){event.preventDefault();return;}modal.innerHTML='';});
window.addEventListener('storage',e=>{if(e.key===LOCAL_KEY&&mode==='local'){state=loadLocal();status='עודכן בחלונית אחרת';render();if(modal.open)toast('הנתונים השתנו בחלונית אחרת. פתח מחדש את הטופס לפני שמירה');}});
let lastDay=E.today();setInterval(()=>{const now=E.today();if(now!==lastDay){lastDay=now;render();}},60000);
// Read-only recovery from the exact project approved by the owner.
// The source database is never updated or cleared by this operation.
let recoveryPending=false,recoveryFailed=false;
function recoveryNotice(){
  if(mode==='demo')return '';
  const saved=loadRecoveryLocal();
  if(state.legacyRecovery&&!state.bank.verified){
    const r=state.legacyRecovery;
    return `<div class="notice">שוחזרו ${r.incomeCount} הכנסות ו־${r.expenseCount} הוצאות מהאתר הישן. הן מופיעות בלשוניות ההכנסות וההוצאות.</div>`;
  }
  if(recoveryPending)return '<div class="notice">בודק את הנתונים הקיימים באתר הישן…</div>';
  if(recoveryFailed&&!saved?.legacyRecovery&&!state.legacyRecovery){
    return `<div class="notice">לא ניתן לטעון כרגע את המידע הישן. הנתונים במקור אינם משתנים. ${button('ניסיון שחזור נוסף','recover-legacy')}${button('ייבוא גיבוי JSON','import-json')}</div>`;
  }
  return '';
}
function loadRecoveryLocal(){
  try{const raw=localStorage.getItem(LOCAL_KEY);return raw?E.validate(JSON.parse(raw)):null;}
  catch(e){return null;}
}
async function recoverLegacy(force=false){
  if(recoveryPending||mode==='demo')return;
  const prior=loadRecoveryLocal();
  if(prior?.legacyRecovery?.source==='money-1d58a/appData'&&prior.legacyRecovery.syncVersion===3&&!force)return;
  recoveryPending=true;recoveryFailed=false;render();
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{
    const url=FIREBASE_CONFIG.databaseURL.replace(/\/$/,'')+'/appData.json';
    // A read-only request. No credentials or financial records are embedded in the source.
    const response=await fetch(url,{signal:controller.signal,cache:'no-store'});
    if(!response.ok)throw Error('לא ניתן לקרוא את הנתונים הישנים. אפשר לייבא את הגיבוי');
    const raw=await response.json();
    if(!raw||!('openingBalance' in raw))throw Error('לא נמצאו נתונים בפורמט של האתר הישן');
    const migrated=E.migrateLegacy(raw);
    // Re-read after the request so edits made while loading cannot be overwritten.
    const oldText=localStorage.getItem(LOCAL_KEY);
    const latest=oldText?E.validate(JSON.parse(oldText)):E.empty();
    // On this upgrade, check for new rows added to the old database after its
    // previous recovery. Compare source IDs with the archived source, so local
    // edits and deliberate deletions are never overwritten or resurrected.
    if(latest.legacyRecovery?.source==='money-1d58a/appData'){
      if(!latest.legacySnapshot)throw Error('אין עותק מקור להשוואה בטוחה. אפשר לייבא גיבוי.');
      const original=E.migrateLegacy(latest.legacySnapshot);
      const knownIncomes=new Set(original.incomes.map(i=>i.id)),knownExpenses=new Set(original.expenses.map(e=>e.id));
      const addedIncomes=migrated.incomes.filter(i=>!knownIncomes.has(i.id)),addedExpenses=migrated.expenses.filter(e=>!knownExpenses.has(e.id));
      const addedIds=new Set(addedExpenses.map(e=>e.id));
      migrated.incomes=addedIncomes;migrated.expenses=addedExpenses;migrated.receipts=migrated.receipts.filter(r=>addedIds.has(r.expenseId));
      // The opening figure remains the original basis for the local ledger.
      migrated.legacySnapshot.openingBalance=latest.legacySnapshot.openingBalance;
    }
    const merged=E.mergeLegacy(latest,migrated);
    // Write immutable backups before changing the active local data.
    if(!localStorage.getItem(LOCAL_KEY+'-original-backup'))localStorage.setItem(LOCAL_KEY+'-original-backup',JSON.stringify(raw));
    if(oldText)localStorage.setItem(LOCAL_KEY+'-before-recovery',oldText);
    localStorage.setItem(LOCAL_KEY,JSON.stringify(merged));
    if(mode==='local'){state=merged;status='המידע הישן שוחזר ונשמר במכשיר';}
    ui.expenseStatus='series';
    if(migrated.incomes.length||migrated.expenses.length)toast(`נוספו ${migrated.incomes.length} הכנסות ו־${migrated.expenses.length} הוצאות מהאתר הישן`);
  }catch(e){recoveryFailed=true;if(force||!prior?.legacyRecovery)toast(e.message||'השחזור לא הושלם. אפשר לייבא את הגיבוי');}
  finally{clearTimeout(timer);recoveryPending=false;render();}
}
// Keep the last confirmed device data visible while reconnecting.
let secureEnabled=false;try{secureEnabled=localStorage.getItem('cashflow-secure-enabled')==='1'||localStorage.getItem('cashflow-restore-session')==='1';}catch(e){}
if(secureEnabled){mode='cloud';cloudReady=false;status='מוצג עותק אחרון — מחבר שמירה פרטית…';}
render();
(async()=>{
  await recoverLegacy();
  if(secureEnabled){state=loadLocal();render();await connectSecure();}
})();

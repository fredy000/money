<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול הוצאות ותקציב</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #ff6f00;
      --text-main: #ffffff;
      --text-muted: #b0b0b0;
      --border-color: #333333;
      --green-bg: rgba(76, 175, 80, 0.15);
      --green-text: #4caf50;
      --orange-bg: rgba(255, 152, 0, 0.15);
      --orange-text: #ff9800;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    h2, h3 {
      margin-top: 0;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #2a2a2a;
      color: white;
      box-sizing: border-box;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row .form-group {
      flex: 1;
    }

    button {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.9;
    }

    /* Summary Card */
    .summary-title {
      font-size: 18px;
      color: var(--text-muted);
    }

    .summary-amount {
      font-size: 28px;
      font-weight: bold;
      color: var(--orange-text);
      margin: 10px 0;
    }

    /* Section Headers */
    .section-header {
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
    }

    .upcoming-header {
      background-color: var(--orange-bg);
      color: var(--orange-text);
    }

    .past-header {
      background-color: var(--green-bg);
      color: var(--green-text);
    }

    /* Expense Item Card */
    .expense-card {
      background-color: #252525;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-right: 4px solid var(--accent-color);
    }

    .expense-info h4 {
      margin: 0 0 5px 0;
      font-size: 16px;
    }

    .expense-details {
      font-size: 12px;
      color: var(--text-muted);
    }

    .expense-amount {
      font-size: 18px;
      font-weight: bold;
      color: #ff5252;
    }

    .category-badge {
      background-color: #333;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      color: var(--text-muted);
      margin-right: 5px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- טופס הוספת הוצאה -->
  <div class="card">
    <h3>+ הוספת הוצאה חדשה</h3>
    <form id="expenseForm">
      <div class="form-group">
        <label for="title">תיאור ההוצאה</label>
        <input type="text" id="title" placeholder="לדוגמה: מקס" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="category">קטגוריה</label>
          <select id="category" required>
            <option value="סופר">סופר</option>
            <option value="דירה">דירה</option>
            <option value="דלק">דלק</option>
            <option value="יציאות עם חברים">יציאות עם חברים</option>
            <option value="אוכל">אוכל</option>
            <option value="מוצרי חשמל">מוצרי חשמל</option>
            <option value="חוויה">חוויה</option>
            <option value="אחר">אחר</option>
          </select>
        </div>

        <div class="form-group">
          <label for="totalAmount">סכום כולל (₪)</label>
          <input type="number" id="totalAmount" step="0.01" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="installments">מספר תשלומים</label>
          <input type="number" id="installments" min="1" value="1" required>
        </div>

        <div class="form-group">
          <label for="firstChargeDate">תאריך חיוב ראשון באשראי</label>
          <input type="date" id="firstChargeDate" required>
        </div>
      </div>

      <button type="submit">הוסף הוצאה</button>
    </form>
  </div>

  <!-- סיכום חיוב קרוב -->
  <div class="card">
    <div class="summary-title">לשלם בעתיד (ירד ב-02 לחודש הקרוב)</div>
    <div class="summary-amount" id="upcomingTotal">₪ 0.00</div>
  </div>

  <!-- רשימת חיובים עתידיים -->
  <div>
    <div class="section-header upcoming-header">
      <span>⏳ לשלם בעתיד (חיוב קרוב)</span>
    </div>
    <div id="upcomingList"></div>
  </div>

  <!-- רשימת חיובים ששולמו -->
  <div style="margin-top: 30px;">
    <div class="section-header past-header">
      <span>שולם בעבר (כבר ירד בעו"ש)</span>
    </div>
    <div id="pastList"></div>
  </div>

</div>

<script>
  // שמירת נתונים ב-LocalStorage
  let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

  const form = document.getElementById('expenseForm');

  // פונקציה לייצור כל התשלומים הבודדים מתוך העסקה
  function processExpenses() {
    const allInstallments = [];

    expenses.forEach(item => {
      const baseAmount = item.totalAmount / item.installments;
      const startDate = new Date(item.firstChargeDate);

      for (let i = 0; i < item.installments; i++) {
        // חישוב תאריך החיוב לכל תשלום בנפרד (חודש אחר חודש)
        const chargeDate = new Date(startDate);
        chargeDate.setMonth(startDate.getMonth() + i);

        allInstallments.push({
          id: item.id,
          title: item.title,
          category: item.category,
          installmentIndex: i + 1,
          totalInstallments: item.installments,
          amount: baseAmount, // אם יש ריבית עתידית משתנה, ניתן לעדכן את החישוב כאן
          totalAmount: item.totalAmount,
          chargeDate: chargeDate
        });
      }
    });

    return allInstallments;
  }

  function render() {
    const allInstallments = processExpenses();
    const now = new Date();
    
    // קביעת חודש ושנת החיוב הקרוב (החיוב הקרוב ביותר שעדיין לא עבר)
    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();

    const upcomingListEl = document.getElementById('upcomingList');
    const pastListEl = document.getElementById('pastList');
    const upcomingTotalEl = document.getElementById('upcomingTotal');

    upcomingListEl.innerHTML = '';
    pastListEl.innerHTML = '';

    let upcomingTotal = 0;

    allInstallments.forEach(item => {
      const itemDate = new Date(item.chargeDate);
      
      // בדיקה אם החיוב הוא מהחודש הנוכחי/עתידי או שכבר עבר
      const isPast = itemDate < new Date(now.getFullYear(), now.getMonth(), 1);
      const isCurrentBillingMonth = itemDate.getMonth() === currentMonth && itemDate.getFullYear() === currentYear;

      const formattedDate = itemDate.toLocaleDateString('he-IL', {
        year: '2-digit',
        month: 'numeric',
        day: 'numeric'
      });

      const html = `
        <div class="expense-card">
          <div class="expense-info">
            <h4>${item.title} (${item.installmentIndex}/${item.totalInstallments}) <span class="category-badge">${item.category}</span></h4>
            <div class="expense-details">
              תאריך חיוב באשראי: ${formattedDate} • תשלום ${item.installmentIndex}/${item.totalInstallments}
              <br>סכום מלא: ₪${item.totalAmount.toFixed(2)}
            </div>
          </div>
          <div class="expense-amount">
            ₪${item.amount.toFixed(2)}-
          </div>
        </div>
      `;

      if (isPast) {
        pastListEl.innerHTML += html;
      } else {
        // מציג ברשימה העתידית
        upcomingListEl.innerHTML += html;
        
        // סוכם רק את מה ששייך לחיוב של החודש הקרוב!
        if (isCurrentBillingMonth) {
          upcomingTotal += item.amount;
        }
      }
    });

    upcomingTotalEl.textContent = `₪ ${upcomingTotal.toFixed(2)}`;
  }

  // טיפול בהוספת טופס
  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const newExpense = {
      id: Date.now(),
      title: document.getElementById('title').value,
      category: document.getElementById('category').value,
      totalAmount: parseFloat(document.getElementById('totalAmount').value),
      installments: parseInt(document.getElementById('installments').value),
      firstChargeDate: document.getElementById('firstChargeDate').value
    };

    expenses.push(newExpense);
    localStorage.setItem('expenses', JSON.stringify(expenses));
    
    form.reset();
    render();
  });

  // טעינה ראשונית
  render();
</script>

</body>
</html>

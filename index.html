<script>
'use strict';
/*
  תזרים לצלם, v2. הכל בקובץ אחד. שמירה מקומית או זיהוי אוטומטי בענן, בלי מסכי משתמשים.
  כסף נשמר באגורות. תאריכים הם YYYY-MM-DD; אין המרה של תאריך מקומי ל-UTC.
  יתרת הבנק אינה מחושבת מעסקאות עבר: כל אישור תשלום שואל האם הוא כבר כלול.
  לוח הבקרה שומר את כל התשלומים הרשומים וקבועות ל-90 יום. התחזית מוצגת בנפרד.
*/
const CashFlow = (() => {
  const DAY = 86400000;
  function parseDate(s) {
    if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s)) throw Error('תאריך לא תקין');
    const [y,m,d]=s.split('-').map(Number), x=new Date(Date.UTC(y,m-1,d));

    return x;
  }
  function strDate(x){return [x.getUTCFullYear(),String(x.getUTCMonth()+1).padStart(2,'0'),String(x.getUTCDate()).padStart(2,'0')].join('-');}

  function addMonths(s,n){const d=parseDate(s), y=d.getUTCFullYear(),m=d.getUTCMonth();const first=new Date(Date.UTC(y,m+n,1)),last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();first.setUTCDate(Math.min(d.getUTCDate(),last));return strDate(first);}
  function dueDate(s,days){if(![0,30,60,90].includes(Number(days)))throw Error('תנאי תשלום לא תקינים');if(Number(days)===0)return s;const d=parseDate(s);return addDays(strDate(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0))),Number(days));}
  function creditDate(purchase,day){const d=parseDate(purchase), y=d.getUTCFullYear(),m=d.getUTCMonth();let f=new Date(Date.UTC(y,m,Math.min(day,new Date(Date.UTC(y,m+1,0)).getUTCDate())));if(strDate(f)<purchase){const last=new Date(Date.UTC(y,m+2,0)).getUTCDate();f=new Date(Date.UTC(y,m+1,Math.min(day,last)));}return strDate(f);}
  function cents(v,negative=false){const s=String(v).trim();if(!/^-?\d+(\.\d{1,2})?$/.test(s))throw Error('יש להזין סכום תקין, עם עד שתי ספרות אחרי הנקודה');const n=Math.round(Number(s)*100);if(!Number.isSafeInteger(n)||Math.abs(n)>100000000000||(!negative&&n<=0))throw Error('הסכום אינו תקין');return n;}
  function integer(n,min=0,max=100000000000){if(!Number.isSafeInteger(n)||n<min||n>max)throw Error('מספר לא תקין בגיבוי');return n;}
  function split(total,count){integer(total,1);integer(count,2,120);if(total<count)throw Error('הסכום קטן מדי למספר התשלומים');const a=Array(count).fill(Math.floor(total/count));a[count-1]+=total-a.reduce((s,x)=>s+x,0);return a;}
  function empty(){return {schemaVersion:2,revision:0,bank:{balanceCents:0,verified:false,updatedAt:null,epoch:0},settings:{bufferCents:500000,taxReserveCents:0,taxBasisPoints:0,creditDay:2,goalCents:0,reserveEpoch:0},incomes:[],expenses:[],receipts:[]};}
  function validate(raw){
    if(!raw||raw.schemaVersion!==2)throw Error('זה אינו גיבוי בגרסה החדשה');
    const d=JSON.parse(JSON.stringify(raw));d.bank.updatedAt=d.bank.updatedAt??null;integer(d.revision);integer(d.bank.balanceCents,-100000000000);integer(d.bank.epoch);if(typeof d.bank.verified!=='boolean')throw Error('פרטי הבנק לא תקינים');
    if(d.bank.updatedAt!==null){if(typeof d.bank.updatedAt!=='string'||!Number.isFinite(Date.parse(d.bank.updatedAt)))throw Error('מועד עדכון לא תקין');}
    if(d.bank.legacyAdjustmentCents!==undefined)integer(d.bank.legacyAdjustmentCents,-100000000000);
    ['bufferCents','taxReserveCents','goalCents'].forEach(k=>integer(d.settings[k]));integer(d.settings.taxBasisPoints,0,10000);integer(d.settings.creditDay,1,31);d.settings.reserveEpoch=d.settings.reserveEpoch||0;integer(d.settings.reserveEpoch);
    ['incomes','expenses','receipts'].forEach(k=>{d[k]=d[k]||[];if(!Array.isArray(d[k])||d[k].length>20000)throw Error('מבנה הגיבוי אינו תקין');});
    const ids=new Set(), id=(x)=>{if(typeof x!=='string'||!/^[-a-zA-Z0-9_]{1,100}$/.test(x))throw Error('מזהה לא תקין');},text=(x)=>{if(typeof x!=='string'||!x.trim()||x.length>500)throw Error('תיאור לא תקין');};
    function unique(x,prefix){id(x);if(ids.has(prefix+x))throw Error('מזהה כפול בגיבוי');ids.add(prefix+x);}
    for(const i of d.incomes){unique(i.id,'i');text(i.client);integer(i.amountCents,1);parseDate(i.date);parseDate(i.expectedDate);if(![0,30,60,90].includes(i.termDays)||!['pending','paid'].includes(i.status))throw Error('פרטי הכנסה לא תקינים');if(i.status==='paid'){i.appliedEpoch=i.appliedEpoch??null;parseDate(i.paidDate);if(i.appliedEpoch!==null)integer(i.appliedEpoch);if(i.taxAddedCents!==undefined)integer(i.taxAddedCents,0,i.amountCents);if(i.taxEpoch!==undefined)integer(i.taxEpoch);}if(typeof i.manualDate!=='boolean')throw Error('תאריך גבייה לא תקין');}
    for(const e of d.expenses){unique(e.id,'e');text(e.desc);text(e.category);if(!['עסקי','אישי'].includes(e.scope))throw Error('סוג הוצאה לא תקין');if(!['אשראי','העברה','מזומן','הוראת קבע'].includes(e.method))throw Error('אמצעי תשלום לא תקין');integer(e.amountCents,1);parseDate(e.purchaseDate);parseDate(e.chargeDate);if(!['once','monthly','installments'].includes(e.kind))throw Error('סדרה לא תקינה');integer(e.count,1,120);integer(e.everyMonths,1,12);if(e.kind==='installments')split(e.amountCents,e.count);if(e.endDate)parseDate(e.endDate);if(e.notBeforeDate)parseDate(e.notBeforeDate);e.overrides=e.overrides||{};if(typeof e.overrides!=='object'||Array.isArray(e.overrides)||Object.keys(e.overrides).length>2000)throw Error('חריגים לא תקינים');for(const [k,o] of Object.entries(e.overrides)){if(!/^\d{1,4}$/.test(k)||Number(k)>1212)throw Error('תשלום לא תקין');if(o.amountCents!==undefined)integer(o.amountCents,1);if(o.chargeDate)parseDate(o.chargeDate);if(o.canceled!==undefined&&typeof o.canceled!=='boolean')throw Error('ביטול לא תקין');}}
    for(const r of d.receipts){r.appliedEpoch=r.appliedEpoch??null;unique(r.key,'r');id(r.expenseId);integer(r.index,0,1212);if(r.key!==r.expenseId+'_'+r.index)throw Error('קבלה לא תקינה');text(r.title);integer(r.amountCents,1);parseDate(r.paidDate);parseDate(r.chargeDate);if(r.appliedEpoch!==null)integer(r.appliedEpoch);}
    if(d.legacyRecovery){const r=d.legacyRecovery;if(r.source!=='money-1d58a/appData')throw Error('מקור שחזור לא תקין');integer(r.incomeCount,0,20000);integer(r.expenseCount,0,20000);if(!Number.isFinite(Date.parse(r.recoveredAt)))throw Error('מועד שחזור לא תקין');}
    return d;
  }
  function occurrences(s,end){
    const result=[],paid=new Set(s.receipts.map(r=>r.key));
    for(const e of s.expenses){
      const amounts=e.kind==='installments'?split(e.amountCents,e.count):null;
      const count=e.kind==='monthly'?1213:e.kind==='installments'?e.count:1;const maxOverride=Math.max(-1,...Object.keys(e.overrides).map(Number));

        const o=e.overrides[String(index)]||{},date=o.chargeDate||base;

        if(date>end||o.canceled)continue;

      existingShortfallCents:Math.max(0,reserves-summary.remainingCents),
      onTime:{endCents:onTime.balance-amountCents,minimumCents:onTime.minAvailable-s.settings.bufferCents-amountCents,date:onTime.minDate},
      late:{endCents:late.balance-amountCents,minimumCents:late.minAvailable-s.settings.bufferCents-amountCents,date:late.minDate},

  function spendingAdvice(s,now=today()){
    const summary=cashSummary(s,now),position=summary.position;
    const sourceIncomes=Array.isArray(s.legacySnapshot?.incomes)?s.legacySnapshot.incomes:Object.values(s.legacySnapshot?.incomes||{});
    const recent=s.incomes.filter(i=>i.status==='paid'&&i.paidDate>=addDays(now,-365)&&i.paidDate<=now&&i.paymentDateEstimated!==true)
      .filter(i=>i.legacyId===undefined||i.paymentDateEstimated===false||sourceIncomes.some((raw,index)=>String(raw.id||index)===i.legacyId&&raw.paidDate))
      .sort((a,b)=>b.paidDate.localeCompare(a.paidDate)).slice(0,12);
    const delays=recent.map(i=>Math.max(0,Math.round((parseDate(i.paidDate)-parseDate(i.expectedDate))/DAY))).sort((a,b)=>a-b);

// --- ממשק משתמש מלא ואפליקציה ---
let appState = CashFlow.empty();
let activeTab = 'dashboard';

function formatILS(centsAmount) {
  const n = (centsAmount / 100).toFixed(2);
  const parts = n.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.') + ' ₪';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  setTimeout(() => { if (t.textContent === msg) t.textContent = ''; }, 3500);
}

function loadLocal() {
  try {
    const raw = localStorage.getItem('cashflow_data');
    if (raw) {
      appState = CashFlow.validate(JSON.parse(raw));
    }
  } catch (e) {
    console.error('Failed to load local data', e);
  }
}

function saveLocal() {
  try {
    localStorage.setItem('cashflow_data', JSON.stringify(appState));
  } catch (e) {
    console.error('Failed to save data', e);
  }
}

function renderApp() {
  const root = document.getElementById('app');
  root.innerHTML = `
    <div class="brand">
      <div class="flex">
        <div class="brand-icon">🎥</div>
        <div>
          <h1>תזרים לצלם</h1>
          <small>ניהול הכנסות, הוצאות ונזילות בזמן אמת</small>
        </div>
      </div>
      <div class="badge">${appState.bank.verified ? 'יתרה מאומתת' : 'יתרה משוערת'}</div>
    </div>

    <div class="tabs">
      <button class="${activeTab==='dashboard'?'active':''}" onclick="setTab('dashboard')">📊 לוח בקרה</button>
      <button class="${activeTab==='calculator'?'active':''}" onclick="setTab('calculator')">🧮 מחשבון רכישה</button>
      <button class="${activeTab==='incomes'?'active':''}" onclick="setTab('incomes')">📈 הכנסות</button>
      <button class="${activeTab==='expenses'?'active':''}" onclick="setTab('expenses')">📉 הוצאות</button>
      <button class="${activeTab==='settings'?'active':''}" onclick="setTab('settings')">⚙️ הגדרות</button>
    </div>

    <div id="tab-content"></div>
  `;

  const content = document.getElementById('tab-content');
  if (activeTab === 'dashboard') content.innerHTML = renderDashboard();
  else if (activeTab === 'calculator') content.innerHTML = renderPurchaseCalculator();
  else if (activeTab === 'incomes') content.innerHTML = renderIncomes();
  else if (activeTab === 'expenses') content.innerHTML = renderExpenses();
  else if (activeTab === 'settings') content.innerHTML = renderSettings();
}

function setTab(tab) {
  activeTab = tab;
  renderApp();
}

  const summary = CashFlow.cashSummary(appState);
  const advice = CashFlow.spendingAdvice(appState);
  const pos = summary.position;

  return `

      <div class="hero">
        <div class="hero-label">יתרת נזילות זמינה להוצאה כעת (Safe to Spend)</div>

        <div class="hint">לאחר ניכוי התחייבויות, כרטיסי אשראי, ורזרבות ביטחון בסך ${formatILS(appState.settings.bufferCents + appState.settings.taxReserveCents)}</div>
      </div>

      <div class="stats">
        <div class="stat">
          <small>יתרה בבנק</small>
          <strong>${formatILS(pos.amountCents)}</strong>
        </div>

          <strong class="red">${formatILS(summary.outgoingCents)}</strong>

          <strong class="green">${formatILS(summary.forecasts[2].incoming)}</strong>
        </div>
        <div class="stat">
          <small>חובות באיחור גבייה</small>

          <label>

          </label>
          <div class="form-actions" style="align-items: flex-end;">
            <button type="submit" class="primary">עדכן יתרה מאומתת</button>
          </div>

  const delayInput = document.getElementById('calc-delay')?.value || 30;
  
  const amountCents = Math.round(Number(amountInput) * 100) || 0;
  const delayDays = Number(delayInput) || 0;

  const plan = CashFlow.purchasePlan(appState, amountCents, delayDays);

  return `
    <div class="section purchase-calculator">
      <div class="card">
        <div class="card-head">
          <h2>🧮 מחשבון רכישה חכם — האם כדאי להוציא?</h2>

        <div class="purchase-budget">
          <div>
            <div class="hint">תקציב נזיל זמין לרכישות כעת:</div>

        </div>

          <label>

          </label>
          <label>

              <option value="0" ${delayDays===0?'selected':''}>ללא עיכוב (0 ימים)</option>
              <option value="30" ${delayDays===30?'selected':''}>עיכוב סטנדרטי (30 ימים)</option>
              <option value="60" ${delayDays===60?'selected':''}>עיכוב ממושך (60 ימים)</option>
              <option value="90" ${delayDays===90?'selected':''}>עיכוב כבד (90 ימים)</option>
            </select>
          </label>

        ${amountCents > 0 ? `
          <div class="purchase-answer ${plan.result === 'within-budget' ? '' : 'purchase-caution'}">
            <h3>${plan.result === 'within-budget' ? '✅ הרכישה מומלצת ובתוך התקציב הבטוח' : '⚠️ אזהרה: הרכישה חורגת מהתקציב הנזיל'}</h3>
            <p>
              ${plan.result === 'within-budget' 
                ? `לאחר הרכישה תיארך יתרה נזילה נותרה של <b>${formatILS(plan.afterPurchaseCents)}</b>, תוך שמירה מלאה על רזרבות הביטחון והמיסים.`
                : `ביצוע רכישה זו כעת ייצור חור ברזרבת הביטחון בגובה <b>${formatILS(plan.reserveGapCents)}</b>.`}
            </p>

            ${plan.overdueCents > 0 ? `
              <div class="notice" style="margin-top:10px;">
                ⚠️ ישנם לקוחות באיחור תשלום בסך <b>${formatILS(plan.overdueCents)}</b>. כספים אלו אינם נחשבים כנזילים במחשבון עד לגבייתם בפועל.
              </div>
            ` : ''}

            <details class="purchase-scenarios">
              <summary>🔍 השוואת תרחישי נזילות (תשלום בזמן מול עיכוב)</summary>
              <div class="advice-budget-grid">
                <div>
                  <small>יתרה בסוף 90 יום (בזמן)</small>
                  <b class="${plan.onTime.endCents >= 0 ? 'green' : 'red'}">${formatILS(plan.onTime.endCents)}</b>
                </div>
                <div>
                  <small>יתרה בסוף 90 יום (עם עיכוב)</small>
                  <b class="${plan.late.endCents >= 0 ? 'green' : 'red'}">${formatILS(plan.late.endCents)}</b>
                </div>
                <div>
                  <small>נקודת שפל נזילה צפויה</small>
                  <b class="orange">${formatILS(plan.onTime.minimumCents)}</b>

              </div>
            </details>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

              <div class="row-main">
                <div class="row-title">${i.client}</div>
                <div class="row-sub">תאריך: ${i.date} | צפוי: ${i.expectedDate} | סטטוס: ${i.status === 'paid' ? '✅ שולם' : '⏳ ממתין לגבייה'}</div>
              </div>
              <div class="amount green">${formatILS(i.amountCents)}</div>
              <div class="actions">
                ${i.status === 'pending' ? `<button class="primary" onclick="confirmPayment('income', '${i.id}')">אישור קבלה</button>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderExpenses() {
  return `
    <div class="section">
      <div class="card">
        <div class="card-head">
          <h2>הוספת הוצאה חדשה</h2>
        </div>
        <form onsubmit="handleAddExpense(event)" class="form">
          <div class="fields">
            <label>
              תיאור ההוצאה:
              <input type="text" id="exp-desc" required placeholder="לדוגמה: השכרת ציוד / דלק">
            </label>
            <label>
              קטגוריה:
              <input type="text" id="exp-cat" required placeholder="ציוד / רכב / שיווק">
            </label>
            <label>
              סכום (בש"ח):
              <input type="number" id="exp-amount" step="0.01" required placeholder="0.00">
            </label>
            <label>
              תאריך רכישה:
              <input type="date" id="exp-date" value="${CashFlow.today()}" required>
            </label>
            <label>
              סוג הוצאה:
              <select id="exp-kind">
                <option value="once">חד-פעמית</option>
                <option value="monthly">חודשית קבועה</option>
                <option value="installments">תשלומים</option>
              </select>
            </label>
            <label>
              אמצעי תשלום:
              <select id="exp-method">
                <option value="אשראי">כרטיס אשראי</option>
                <option value="העברה">העברה בנקאית</option>
                <option value="מזומן">מזומן</option>
                <option value="הוראת קבע">הוראת קבע</option>
              </select>
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="primary">+ הוסף הוצאה</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>רשימת הוצאות רשומות</h2>
        <div class="list">
          ${appState.expenses.length === 0 ? '<div class="empty">אין הוצאות רשומות במערכת</div>' : ''}
          ${appState.expenses.map(e => `
            <div class="row">
              <div class="row-main">
                <div class="row-title">${e.desc} (${e.category})</div>
                <div class="row-sub">תאריך: ${e.purchaseDate} | סוג: ${e.kind} | אמצעי: ${e.method}</div>
              </div>
              <div class="amount red">${formatILS(e.amountCents)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderSettings() {
  return `
    <div class="section">
      <div class="card">
        <h2>⚙️ הגדרות תזרים ורזרבות</h2>
        <form onsubmit="handleSaveSettings(event)" class="form">
          <div class="fields">
            <label>
              רזרבת ביטחון לבלת"מים (בש"ח):
              <input type="number" id="set-buffer" step="0.01" value="${appState.settings.bufferCents / 100}">
            </label>
            <label>
              אחוז הפרשה למיסים (%):
              <input type="number" id="set-tax" step="0.1" value="${appState.settings.taxBasisPoints / 100}">
            </label>
            <label>
              יום חיוב אשראי בחודש:
              <input type="number" id="set-credit-day" min="1" max="31" value="${appState.settings.creditDay}">
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="primary">שמור הגדרות</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

// --- מטפלי אירועים (Event Handlers) ---
function handleReconcile(e) {
  e.preventDefault();
  try {
    const val = document.getElementById('bank-balance-input').value;
    const centsVal = CashFlow.cents(val, true);
    CashFlow.reconcile(appState, centsVal);
    saveLocal();
    showToast('יתרת הבנק עודכנה בהצלחה!');
    renderApp();
  } catch (err) {
    showToast(err.message);
  }
}

function handleAddIncome(e) {
  e.preventDefault();
  try {
    const client = document.getElementById('inc-client').value;
    const amountCents = CashFlow.cents(document.getElementById('inc-amount').value);
    const date = document.getElementById('inc-date').value;
    const termDays = Number(document.getElementById('inc-terms').value);
    const expectedDate = CashFlow.dueDate(date, termDays);

    const newIncome = {
      id: 'inc_' + Date.now(),
      client,
      amountCents,
      date,
      expectedDate,
      termDays,
      status: 'pending',
      manualDate: false
    };

    appState.incomes.push(newIncome);
    saveLocal();
    showToast('הכנסה חדשה נוספה בהצלחה!');
    renderApp();
  } catch (err) {
    showToast(err.message);
  }
}

function handleAddExpense(e) {
  e.preventDefault();
  try {
    const desc = document.getElementById('exp-desc').value;
    const category = document.getElementById('exp-cat').value;
    const amountCents = CashFlow.cents(document.getElementById('exp-amount').value);
    const purchaseDate = document.getElementById('exp-date').value;
    const kind = document.getElementById('exp-kind').value;
    const method = document.getElementById('exp-method').value;

    const chargeDate = method === 'אשראי' ? CashFlow.creditDate(purchaseDate, appState.settings.creditDay) : purchaseDate;

    const newExpense = {
      id: 'exp_' + Date.now(),
      desc,
      category,
      scope: 'עסקי',
      method,
      amountCents,
      purchaseDate,
      chargeDate,
      kind,
      count: 1,
      everyMonths: 1,
      overrides: {}
    };

    appState.expenses.push(newExpense);
    saveLocal();
    showToast('הוצאה חדשה נוספה בהצלחה!');
    renderApp();
  } catch (err) {
    showToast(err.message);
  }
}

function confirmPayment(type, id) {
  try {
    const todayStr = CashFlow.today();
    CashFlow.applyPayment(appState, type, id, todayStr, false);
    saveLocal();
    showToast('התשלום אושר ועודכן בתזרים!');
    renderApp();
  } catch (err) {
    showToast(err.message);
  }
}

function handleSaveSettings(e) {
  e.preventDefault();
  try {
    const buffer = CashFlow.cents(document.getElementById('set-buffer').value);
    const taxBasis = Math.round(Number(document.getElementById('set-tax').value) * 100);
    const creditDay = Number(document.getElementById('set-credit-day').value);

    appState.settings.bufferCents = buffer;
    appState.settings.taxBasisPoints = taxBasis;
    appState.settings.creditDay = creditDay;

    saveLocal();
    showToast('ההגדרות נשמרו בהצלחה!');
    renderApp();
  } catch (err) {
    showToast(err.message);
  }
}

// אתחול האפליקציה
loadLocal();
renderApp();
</script>
</body>
</html>

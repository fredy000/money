<script type="module">

  const uid = () => Math.random().toString(36).slice(2, 10);
  const dateToStr = (date) => {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  };

  const parseLocalDate = (value) => {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || ""));
    if (!match) return new Date(NaN);
    return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]), 12);
  };

  const todayStr = () => dateToStr(new Date());
  
  const calcExpectedDate = (invoiceDateStr, termDays) => {
    const invoiceDate = parseLocalDate(invoiceDateStr);
    const daysToAdd = Number(termDays) || 0;

    if (Number.isNaN(invoiceDate.getTime())) return invoiceDateStr;
    if (daysToAdd <= 0) return invoiceDateStr;

    const endOfInvoiceMonth = new Date(
      invoiceDate.getFullYear(),
      invoiceDate.getMonth() + 1,
      0,
      12
    );
    endOfInvoiceMonth.setDate(endOfInvoiceMonth.getDate() + daysToAdd);
    return dateToStr(endOfInvoiceMonth);
  };

  const calcCreditChargeDate = (expenseDateStr, billingDay = 2) => {
    const d = parseLocalDate(expenseDateStr);
    let month = d.getMonth();
    let year = d.getFullYear();
    if (d.getDate() >= billingDay) {
      month += 1;
    }
    const lastDay = new Date(year, month + 1, 0).getDate();
    const chargeDate = new Date(year, month, Math.min(Number(billingDay), lastDay), 12);
    return dateToStr(chargeDate);
  };

  const addMonths = (d, months) => {
    const source = parseLocalDate(d);
    const target = new Date(source.getFullYear(), source.getMonth() + Number(months), 1, 12);
    const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    target.setDate(Math.min(source.getDate(), lastDay));
    return dateToStr(target);
  };

  const calcInstallmentStartDate = (purchaseDateStr) => {
    const purchaseDate = parseLocalDate(purchaseDateStr);
    if (Number.isNaN(purchaseDate.getTime())) return purchaseDateStr;
    return purchaseDate.getDate() >= 25 ? addMonths(purchaseDateStr, 1) : purchaseDateStr;
  };

  const normalizeInstallmentSchedules = (expenses) => {
    const normalized = (expenses || []).map((expense) => ({ ...expense }));
    const groups = new Map();

    normalized.forEach((expense) => {
      if (!expense.installmentGroupId) return;
      if (!groups.has(expense.installmentGroupId)) groups.set(expense.installmentGroupId, []);
      groups.get(expense.installmentGroupId).push(expense);
    });

    let changed = false;

    groups.forEach((series) => {
      if (series.every((expense) => Number(expense.scheduleVersion) >= 2)) return;

      series.sort((a, b) => {
        const aNumber = Number(String(a.installmentInfo || "1/1").split("/")[0]);
        const bNumber = Number(String(b.installmentInfo || "1/1").split("/")[0]);
        return aNumber - bNumber;
      });

      const purchaseDate = series[0].purchaseDate || series[0].date;
      const firstPaymentDate = calcInstallmentStartDate(purchaseDate);

      series.forEach((expense, index) => {
        expense.purchaseDate = purchaseDate;
        expense.date = addMonths(firstPaymentDate, index);
        expense.scheduleVersion = 2;
      });

      changed = true;
    });

    return { expenses: normalized, changed };
  };

  const splitInstallmentAmounts = (originalAmount, count, interest = 0, customMonthly = 0) => {
    const payments = Number(count);
    const originalCents = Math.round(Number(originalAmount) * 100);
    if (!Number.isInteger(payments) || payments < 2 || payments > 36 || originalCents <= 0) return [];

    if (Number(customMonthly) > 0) {
      const monthlyCents = Math.round(Number(customMonthly) * 100);
      return Array(payments).fill(monthlyCents);
    }

    const totalCents = originalCents + Math.max(0, Math.round(Number(interest || 0) * 100));
    const base = Math.floor(totalCents / payments);
    const remainder = totalCents - (base * payments);
    return Array.from({ length: payments }, (_, index) => base + (index >= payments - remainder ? 1 : 0));
  };

  const fmtMoney = (n) => {
    const val = Number(n || 0);
    return new Intl.NumberFormat("he-IL", { 
      style: "currency", 
      currency: "ILS", 
      minimumFractionDigits: 0, 
      maximumFractionDigits: 2 
    }).format(val);
  };

  const fmtDate = (d) => new Intl.DateTimeFormat("he-IL", { day: "numeric", month: "short", year: "2-digit" }).format(parseLocalDate(d));
  const monthKey = (d) => (d ? d.slice(0, 7) : todayStr().slice(0, 7));
  const daysUntil = (d) => Math.round((parseLocalDate(d) - parseLocalDate(todayStr())) / 86400000);
  const esc = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ============================================================================

  window.saveApiKey = function() {
    const input = document.getElementById("api-key-input");
    if (input && input.value.trim()) {

  };

  window.removeApiKey = function() {
    localStorage.removeItem("GEMINI_API_KEY");
    aiAdviceCache = null;
    render();
  };

  window.triggerAiRefresh = function() {
    aiAdviceCache = null;
    const c = calc();
    fetchGeminiAdvice(c);
  };

  function renderAIAssistant(c) {
    const apiKey = localStorage.getItem("GEMINI_API_KEY");

    if (!apiKey) {
      return `
        <div class="ai-card">
          <div class="ai-header">

          </div>

  async function fetchGeminiAdvice(c) {
    if (aiLoading) return;
    aiLoading = true;

    if (!apiKey) {

    }

    const prompt = `
אתה יועץ פיננסי בכיר, טקטי וממוקד לפרילנסרים בתעשיית הצילום והקולנוע.
להלן נתוני התזרים המעודכנים של המשתמש (ב-₪):
- יתרה נוכחית בעו"ש: ${c.actualCurrentBalance}

- הוצאות צפויות חודש הבא: ${c.totalExpNextMonth}

- הכנסות ממתינות (שוטף+): ${c.monthExpectedIncome}

הפק ניתוח קצר, קולע ושימושי ב-4 בולטים קצרים (כלול אימוג'ים מתאימים):

4. השקעות ועודפים: המלצה מעשית לגבי עודפים פנויים (חיסכון/השקעה במדדים או מניות) או אזהרה דחופה אם יש חוסר.

ענה בקצרה, ישירות לשורה התחתונה, ללא הקדמות מנומסות.

    // בדיקת דגמים רשמיים ונתמכים בלבד
    const modelsToTry = ["gemini-1.5-flash", "gemini-2.0-flash", "gemini-1.5-pro"];
    let success = false;
    let lastError = "";

    for (const modelName of modelsToTry) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();

        if (res.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
          aiAdviceCache = data.candidates[0].content.parts[0].text;
          success = true;
          break;
        } else if (data.error) {
          console.warn(`Model ${modelName} returned error:`, data.error.message);
          lastError = data.error.message;
        }
      } catch (err) {
        console.error(`Fetch error with ${modelName}:`, err);
        lastError = err.message;
      }
    }

    if (!success) {
      aiErrorMsg = `שגיאה בחיבור: ${lastError || "בדוק שהמפתח תקין ושיש חיבור אינטרנט זמין."}`;
    }

    aiLoading = false;
    render();
  }

  function startDataListener() {
    if (stopDataListener) return;

    stopDataListener = onValue(dbRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        state = {
          openingBalance: Number(data.openingBalance) || 0,
          creditCardBillingDay: Number(data.creditCardBillingDay) || 2,
          incomes: (data.incomes || []).map(inc => ({
            ...inc,
            expectedDate: calcExpectedDate(inc.date, inc.termDays || 0)
          })),
          expenses: data.expenses || []
        };

        const normalizedSchedules = normalizeInstallmentSchedules(state.expenses);
        state.expenses = normalizedSchedules.expenses;

        if (normalizedSchedules.changed) {
          set(dbRef, state).catch(() => {
            syncStatus = "שגיאה בעדכון התשלומים ❌";
            render();
          });
        }
      } else {
        saveToCloud();
      }
      render();
    }, () => {
      syncStatus = "הגישה לנתונים נחסמה ⚠️";
      render();
    });
  }

  function calc() {
    const today = todayStr();
    const thisMonth = monthKey(today);
    const nextMonth = monthKey(addMonths(today, 1));

    const paid = (state.incomes || []).filter((income) => income.status === "paid");
    const pending = (state.incomes || [])
      .filter((income) => income.status !== "paid")
      .sort((a, b) => a.expectedDate.localeCompare(b.expectedDate));

    const pastExpenses = (state.expenses || []).filter(
      (expense) => monthKey(expense.date) < thisMonth
    );

    const currentExpenses = (state.expenses || []).filter(
      (expense) => monthKey(expense.date) === thisMonth
    );

    const futureExpenses = (state.expenses || []).filter(
      (expense) => monthKey(expense.date) === nextMonth
    );

    const laterExpenses = (state.expenses || []).filter(
      (expense) => monthKey(expense.date) > nextMonth
    );

    const totalExpPast = pastExpenses.reduce((sum, expense) => sum + Number(expense.amount), 0);
    const totalExpCurrent = currentExpenses.reduce((sum, expense) => sum + Number(expense.amount), 0);
    const totalExpFuture = futureExpenses.reduce((sum, expense) => sum + Number(expense.amount), 0);
    const totalExpLater = laterExpenses.reduce((sum, expense) => sum + Number(expense.amount), 0);

    const actualCurrentBalance = Number(state.openingBalance || 0);
    const amountToPayThisMonth = totalExpCurrent;
    const balanceAfterExpenses = actualCurrentBalance - amountToPayThisMonth;

    const monthPaidIncome = paid
      .filter((income) => monthKey(income.paidDate || income.date) === thisMonth)
      .reduce((sum, income) => sum + Number(income.amount), 0);

    const monthExpectedIncome = pending
      .filter((income) => monthKey(income.expectedDate) === thisMonth)
      .reduce((sum, income) => sum + Number(income.amount), 0);

    const finalExpectedBalance = balanceAfterExpenses + monthExpectedIncome;
    const safeToSpend = Math.max(0, balanceAfterExpenses);
    const overdueIncomes = pending.filter((income) => daysUntil(income.expectedDate) < 0);
    const overdueAmount = overdueIncomes.reduce((sum, income) => sum + Number(income.amount), 0);

    return {
      openingBalance: Number(state.openingBalance || 0),
      actualCurrentBalance,
      amountToPayThisMonth,
      balanceAfterExpenses,
      finalExpectedBalance,
      pending,
      monthPaidIncome,
      monthExpectedIncome,
      totalExpPast,
      totalExpCurrent,
      totalExpFuture,
      totalExpNextMonth: totalExpFuture,
      totalExpLater,
      safeToSpend,
      overdueAmount,
      overdueCount: overdueIncomes.length,
      pastExpenses,
      currentExpenses,
      futureExpenses,
      laterExpenses
    };
  }

      ui.showIncomeForm = !ui.showIncomeForm;
      ui.editingIncomeId = null;
      render();
    } else if (action === "edit-income") {
      ui.editingIncomeId = btn.dataset.id;
      ui.showIncomeForm = true;
      render();
    } else if (action === "save-income") {
      const desc = document.getElementById("inc-desc").value.trim();
      const amount = parseFloat(document.getElementById("inc-amount").value);
      const date = document.getElementById("inc-date").value;
      const termDays = parseInt(document.getElementById("inc-terms").value) || 0;

      if (desc && !isNaN(amount) && date) {
        if (ui.editingIncomeId) {
          const inc = state.incomes.find(i => i.id === ui.editingIncomeId);
          if (inc) {
            inc.desc = desc;
            inc.amount = amount;
            inc.date = date;
            inc.termDays = termDays;
            inc.expectedDate = calcExpectedDate(date, termDays);
          }
        } else {
          state.incomes.push({
            id: uid(),
            desc,
            amount,
            date,
            termDays,
            expectedDate: calcExpectedDate(date, termDays),
            status: "pending"
          });
        }
        ui.showIncomeForm = false;
        ui.editingIncomeId = null;
        aiAdviceCache = null;
        saveToCloud();
      }
    } else if (action === "mark-paid") {
      const id = btn.dataset.id;
      const inc = state.incomes.find(i => i.id === id);
      if (inc) {
        inc.status = "paid";
        inc.paidDate = todayStr();
        aiAdviceCache = null;
        saveToCloud();
      }
    } else if (action === "delete-income") {
      const id = btn.dataset.id;
      state.incomes = state.incomes.filter(i => i.id !== id);
      aiAdviceCache = null;
      saveToCloud();
    } else if (action === "toggle-expense-form") {
      ui.showExpenseForm = !ui.showExpenseForm;
      ui.editingExpenseId = null;
      ui.isInstallments = false;
      render();
    } else if (action === "select-category") {
      ui.selectedCategory = btn.dataset.cat;
      render();
    } else if (action === "toggle-installments-checkbox") {
      ui.isInstallments = e.target.checked;
      render();
    } else if (action === "toggle-later-expenses") {
      ui.showLaterExpenses = !ui.showLaterExpenses;
      render();
    } else if (action === "edit-expense") {
      ui.editingExpenseId = btn.dataset.id;
      const exp = state.expenses.find(e => e.id === ui.editingExpenseId);
      if (exp) {
        ui.selectedCategory = exp.category || CATEGORIES[0].name;
      }
      ui.showExpenseForm = true;
      render();
    } else if (action === "save-expense") {
      const desc = document.getElementById("exp-desc").value.trim();
      const amount = parseFloat(document.getElementById("exp-amount").value);
      const purchaseDate = document.getElementById("exp-date").value;

      if (desc && !isNaN(amount) && purchaseDate) {
        if (ui.editingExpenseId) {
          const exp = state.expenses.find(e => e.id === ui.editingExpenseId);
          if (exp) {
            exp.desc = desc;
            exp.amount = amount;
            exp.category = ui.selectedCategory;
            exp.purchaseDate = purchaseDate;
            exp.date = calcCreditChargeDate(purchaseDate, state.creditCardBillingDay);
          }
        } else if (ui.isInstallments) {
          const count = parseInt(document.getElementById("exp-installments-count").value) || 2;
          const interest = parseFloat(document.getElementById("exp-interest").value) || 0;
          const customMonthly = parseFloat(document.getElementById("exp-custom-monthly").value) || 0;
          const groupId = uid();

          const partsCents = splitInstallmentAmounts(amount, count, interest, customMonthly);
          const firstPaymentDate = calcInstallmentStartDate(purchaseDate);

          partsCents.forEach((cents, i) => {
            const paymentMonthDate = addMonths(firstPaymentDate, i);
            const chargeDate = calcCreditChargeDate(paymentMonthDate, state.creditCardBillingDay);
            state.expenses.push({
              id: uid(),
              installmentGroupId: groupId,
              scheduleVersion: 2,
              desc,
              amount: cents / 100,
              category: ui.selectedCategory,
              purchaseDate,
              date: chargeDate,
              installmentInfo: `${i + 1}/${count}`
            });
          });
        } else {
          const chargeDate = calcCreditChargeDate(purchaseDate, state.creditCardBillingDay);
          state.expenses.push({
            id: uid(),
            desc,
            amount,
            category: ui.selectedCategory,
            purchaseDate,
            date: chargeDate
          });
        }

        ui.showExpenseForm = false;
        ui.editingExpenseId = null;
        ui.isInstallments = false;
        aiAdviceCache = null;
        saveToCloud();
      }
    } else if (action === "delete-expense") {
      const id = btn.dataset.id;
      const target = state.expenses.find(e => e.id === id);
      if (target && target.installmentGroupId) {
        if (confirm("האם למחוק את כל סדרת התשלומים של הוצאה זו?")) {
          state.expenses = state.expenses.filter(e => e.installmentGroupId !== target.installmentGroupId);
        }
      } else {
        state.expenses = state.expenses.filter(e => e.id !== id);
      }
      aiAdviceCache = null;
      saveToCloud();
    }
  });
</script>
</body>
</html>
